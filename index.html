<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>The Recipe Book</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

const STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&family=Lato:wght@300;400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --parchment: #f5f0e8; --parchment-dark: #ede5d0; --ink: #1a1410;
    --ink-mid: #3d3028; --ink-light: #7a6a5a; --saffron: #d4891a;
    --saffron-light: #f0b84b; --rust: #b84a2e; --sage: #5a7a4a;
    --cream: #faf7f0; --shadow: rgba(26,20,16,0.12);
  }
  body { background: var(--parchment); color: var(--ink); font-family: 'Lato', sans-serif; min-height: 100vh; -webkit-overflow-scrolling: touch; }
  * { -webkit-tap-highlight-color: transparent; }
  .app { max-width: 1200px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  .header { padding: 32px 0 24px; border-bottom: 2px solid var(--ink); margin-bottom: 32px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .header-title { font-family: 'Special Elite', monospace; font-size: clamp(28px,5vw,48px); color: var(--ink); letter-spacing: -1px; }
  .header-title span { color: var(--saffron); }
  .header-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--ink-light); margin-top: 4px; }

  /* Nav */
  .nav-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); margin-bottom: 28px; flex-wrap: wrap; }
  .nav-tab { padding: 7px 12px; font-family: 'Lato', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; background: none; border: none; color: var(--ink-light); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
  .nav-tab:hover { color: var(--ink); }
  .nav-tab.active { color: var(--saffron); border-bottom-color: var(--saffron); }

  /* Recipe Grid — photo-aware cards */
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .recipe-card { background: var(--cream); border: 1px solid var(--parchment-dark); border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 2px 2px 0 var(--shadow); overflow: hidden; }
  .recipe-card:hover { transform: translateY(-2px); box-shadow: 4px 8px 0 var(--shadow); }
  .recipe-card.selected { border-color: var(--saffron); box-shadow: 0 0 0 2px var(--saffron); }
  .recipe-card-photo { width: 100%; height: 180px; object-fit: cover; display: block; }
  .recipe-card-photo-placeholder { width: 100%; height: 140px; background: var(--parchment-dark); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--ink-light); }
  .recipe-card-body { padding: 16px 20px 20px; position: relative; }
  .recipe-card-body::before { content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 2px; background: var(--saffron); }
  .recipe-card-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .recipe-card-meta { font-size: 12px; color: var(--ink-light); display: flex; gap: 12px; flex-wrap: wrap; }
  .recipe-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  /* Tags */
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 2px; background: var(--parchment-dark); color: var(--ink-mid); }
  .tag.diet { background: #d4e8d0; color: var(--sage); }
  .tag.ai { background: #dce8d4; color: var(--sage); }

  /* Toolbar */
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-input { flex: 1; min-width: 140px; padding: 7px 10px; font-family: 'Lato', sans-serif; font-size: 13px; border: 1px solid var(--ink-mid); background: var(--cream); color: var(--ink); border-radius: 3px; outline: none; }
  .search-input:focus { border-color: var(--saffron); box-shadow: 0 0 0 2px rgba(212,137,26,0.2); }
  .filter-select { padding: 7px 10px; font-family: 'Lato', sans-serif; font-size: 12px; border: 1px solid var(--ink-mid); background: var(--cream); color: var(--ink); border-radius: 3px; cursor: pointer; }

  /* Buttons */
  .btn { padding: 10px 20px; font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 3px; transition: all 0.15s; border: 2px solid; }
  .btn-primary { background: var(--saffron); color: white; border-color: var(--saffron); }
  .btn-primary:hover { background: var(--saffron-light); border-color: var(--saffron-light); }
  .btn-outline { background: none; color: var(--ink); border-color: var(--ink); }
  .btn-outline:hover { background: var(--ink); color: var(--cream); }
  .btn-ghost { background: none; color: var(--ink-light); border-color: transparent; }
  .btn-ghost:hover { color: var(--ink); border-color: var(--parchment-dark); }
  .btn-danger { background: none; color: var(--rust); border-color: var(--rust); }
  .btn-danger:hover { background: var(--rust); color: white; }
  .btn-sm { padding: 6px 12px; font-size: 11px; }
  .btn-icon { padding: 8px; border: none; background: none; cursor: pointer; color: var(--ink-light); font-size: 18px; transition: color 0.2s; }
  .btn-icon:hover { color: var(--saffron); }

  /* Detail panel */
  .detail-panel { background: var(--cream); border: 1px solid var(--parchment-dark); border-radius: 6px; box-shadow: 3px 3px 0 var(--shadow); }
  .detail-hero { position: relative; width: 100%; height: 220px; background: var(--parchment-dark); overflow: hidden; flex-shrink: 0; }
  .detail-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-hero-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 72px; color: var(--ink-light); background: var(--parchment-dark); }
  .detail-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, rgba(26,20,16,0.7)); }
  .detail-hero-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; }
  .detail-hero-btn { padding: 8px 14px; font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 3px; cursor: pointer; border: none; backdrop-filter: blur(8px); transition: all 0.15s; }
  .detail-hero-btn-light { background: rgba(255,255,255,0.85); color: var(--ink); }
  .detail-hero-btn-light:hover { background: white; }
  .detail-hero-btn-primary { background: rgba(212,137,26,0.9); color: white; }
  .detail-hero-btn-primary:hover { background: var(--saffron); }
  .detail-hero-btn-danger { background: rgba(184,74,46,0.85); color: white; }
  .detail-hero-btn-danger:hover { background: var(--rust); }
  .detail-content { padding: 20px 16px 32px; }
  .detail-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .detail-meta { display: flex; gap: 20px; color: var(--ink-light); font-size: 13px; margin-bottom: 20px; flex-wrap: wrap; }
  .detail-section-title { font-family: 'Special Elite', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--ink-mid); margin: 24px 0 12px; border-bottom: 1px solid var(--parchment-dark); padding-bottom: 8px; }

  /* Ingredients & steps */
  .ingredient-list { list-style: none; }
  .ingredient-list li { padding: 6px 0; border-bottom: 1px dashed var(--parchment-dark); font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ing-amount { font-weight: 700; color: var(--saffron); min-width: 80px; }
  .ing-name { flex: 1; }
  .step-list { list-style: none; counter-reset: steps; }
  .step-list li { counter-increment: steps; padding: 10px 0 10px 44px; position: relative; border-bottom: 1px solid var(--parchment-dark); font-size: 15px; line-height: 1.6; }
  .step-list li::before { content: counter(steps); position: absolute; left: 0; top: 10px; width: 28px; height: 28px; background: var(--ink); color: var(--cream); display: flex; align-items: center; justify-content: center; font-family: 'Special Elite', monospace; font-size: 13px; border-radius: 50%; }

  /* Nutrition */
  .nutrition-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 4px; }
  .nutrition-card { background: var(--parchment-dark); border-radius: 4px; padding: 10px 12px; text-align: center; }
  .nutrition-value { font-family: 'Special Elite', monospace; font-size: 20px; color: var(--ink); }
  .nutrition-unit { font-size: 11px; color: var(--ink-light); }
  .nutrition-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-mid); margin-top: 2px; }

  /* Diet */
  .diet-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .diet-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #d4e8d0; color: var(--sage); border: 1px solid #b0d4aa; }

  /* Scaler */
  .servings-scaler { display: flex; align-items: center; gap: 12px; background: var(--parchment-dark); padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .scaler-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-mid); }
  .scaler-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--saffron); background: none; color: var(--saffron); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: all 0.15s; line-height: 1; }
  .scaler-btn:hover { background: var(--saffron); color: white; }
  .scaler-value { font-family: 'Special Elite', monospace; font-size: 22px; color: var(--ink); min-width: 32px; text-align: center; }
  .scaler-original { font-size: 12px; color: var(--ink-light); }

  /* Sticky recipe action bar */
  .recipe-action-bar { position: sticky; top: 0; z-index: 20; background: var(--ink); padding: 8px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .recipe-action-bar-title { font-family: 'Playfair Display', serif; font-size: 15px; color: white; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recipe-action-btn { padding: 7px 10px; font-family: 'Lato', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; border-radius: 3px; cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .recipe-action-btn-cook { background: var(--saffron); color: white; }
  .recipe-action-btn-cook:active { background: var(--saffron-light); }
  .recipe-action-btn-edit { background: rgba(255,255,255,0.15); color: white; }
  .recipe-action-btn-edit:active { background: rgba(255,255,255,0.25); }
  .recipe-action-btn-fav { background: none; border: none; font-size: 18px; padding: 4px; cursor: pointer; }
  .recipe-action-btn-danger { background: rgba(184,74,46,0.85); color: white; padding: 7px 10px; }
  .recipe-action-btn-danger:active { background: var(--rust); }

  /* Photo upload widget */
  .photo-upload-label { display: block; border: 2px dashed var(--parchment-dark); border-radius: 6px; padding: 20px 16px; text-align: center; background: var(--cream); cursor: pointer; -webkit-tap-highlight-color: rgba(212,137,26,0.1); }
  .photo-upload-label:active { background: rgba(212,137,26,0.06); border-color: var(--saffron); }
  .photo-upload-label input[type=file] { width: 0.1px; height: 0.1px; opacity: 0; overflow: hidden; position: absolute; z-index: -1; }
  .photo-upload-icon { font-size: 28px; display: block; margin-bottom: 6px; pointer-events: none; }
  .photo-upload-text { display: block; font-size: 14px; font-weight: 700; color: var(--saffron); pointer-events: none; margin-bottom: 2px; }
  .photo-upload-sub { display: block; font-size: 11px; color: var(--ink-light); pointer-events: none; }
  /* Multi-photo gallery */
  .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 8px; margin-bottom: 10px; }
  .photo-thumb-wrap { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; }
  .photo-thumb { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .photo-thumb-hero { border: 3px solid var(--saffron); }
  .photo-thumb-remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(184,74,46,0.9); color: white; border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .photo-thumb-hero-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(212,137,26,0.85); color: white; font-size: 9px; font-weight: 700; text-align: center; padding: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .photo-set-hero-btn { position: absolute; top: 4px; left: 4px; padding: 2px 6px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 3px; font-size: 10px; cursor: pointer; }
  /* Lightbox nav */
  .lightbox-prev, .lightbox-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: none; color: white; font-size: 28px; padding: 12px 16px; cursor: pointer; border-radius: 4px; }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 13px; }
  .photo-remove-btn { padding: 8px 16px; background: none; color: var(--rust); border: 2px solid var(--rust); border-radius: 3px; font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
  .photo-remove-btn:active { background: var(--rust); color: white; }

  /* Photo lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 4px; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; font-size: 32px; color: rgba(255,255,255,0.7); cursor: pointer; line-height: 1; background: none; border: none; }

  /* Cook mode */
  .cook-mode-overlay { position: fixed; inset: 0; background: var(--ink); color: var(--cream); z-index: 100; display: flex; flex-direction: column; font-family: 'Lato', sans-serif; overflow-y: auto; }
  .cook-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .cook-title { font-family: 'Special Elite', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; }
  .cook-recipe-name { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--saffron-light); }
  .cook-progress { display: flex; gap: 6px; flex-wrap: wrap; }
  .cook-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
  .cook-dot.done { background: var(--saffron); }
  .cook-dot.current { background: var(--saffron-light); transform: scale(1.4); }
  .cook-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .cook-photo { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; margin-bottom: 24px; border: 4px solid rgba(240,184,75,0.4); }
  .cook-step-num { font-family: 'Special Elite', monospace; font-size: 64px; color: rgba(255,255,255,0.08); line-height: 1; margin-bottom: 8px; }
  .cook-recipe-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--saffron); margin-bottom: 16px; font-weight: 700; }
  .cook-step-text { font-family: 'Playfair Display', serif; font-size: clamp(20px,3.5vw,32px); line-height: 1.5; max-width: 700px; }
  .cook-ingredients { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; max-width: 700px; }
  .cook-ing-chip { background: rgba(240,184,75,0.15); border: 1px solid rgba(240,184,75,0.4); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--saffron-light); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .cook-ing-amount { font-family: 'Special Elite', monospace; font-size: 15px; color: var(--saffron-light); font-weight: 700; }
  .cook-ing-name { font-size: 12px; color: rgba(255,255,255,0.6); }
  .cook-nav { display: flex; gap: 20px; align-items: center; padding: 24px; justify-content: center; }
  .cook-nav-btn { padding: 14px 32px; font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 3px; cursor: pointer; border: 2px solid; }
  .cook-prev { background: none; border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
  .cook-prev:hover { border-color: white; color: white; }
  .cook-next { background: var(--saffron); border-color: var(--saffron); color: white; }
  .cook-next:hover { background: var(--saffron-light); border-color: var(--saffron-light); }

  /* Dinner planner */
  .orch-timeline { position: relative; }
  .orch-entry { display: flex; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px dashed var(--parchment-dark); }
  .orch-badge { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Special Elite', monospace; font-size: 13px; font-weight: 700; color: white; }
  .orch-step-text { font-size: 15px; line-height: 1.5; }
  .orch-recipe-name { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 2px; opacity: 0.7; }
  .dinner-card-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--parchment-dark); flex-shrink: 0; }
  .dinner-card-thumb-placeholder { width: 48px; height: 48px; border-radius: 50%; background: var(--parchment-dark); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }

  /* AI panel */
  .ai-panel { background: var(--cream); border: 1px solid var(--parchment-dark); border-radius: 4px; padding: 24px; }
  .ai-messages { max-height: 400px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ai-msg { padding: 12px 16px; border-radius: 4px; font-size: 14px; line-height: 1.6; }
  .ai-msg.user { background: var(--parchment-dark); align-self: flex-end; max-width: 80%; }
  .ai-msg.assistant { background: white; border: 1px solid var(--parchment-dark); max-width: 90%; white-space: pre-wrap; }
  .ai-msg.loading { opacity: 0.6; font-style: italic; }
  .ai-input-row { display: flex; gap: 10px; }
  .ai-input { flex: 1; padding: 10px 14px; font-family: 'Lato', sans-serif; font-size: 14px; border: 1px solid var(--ink-mid); background: white; color: var(--ink); border-radius: 3px; }
  .ai-input:focus { outline: none; border-color: var(--saffron); }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-mid); margin-bottom: 6px; }
  .form-input { width: 100%; padding: 10px 12px; font-family: 'Lato', sans-serif; font-size: 14px; border: 1px solid var(--parchment-dark); background: var(--cream); color: var(--ink); border-radius: 3px; }
  .form-input:focus { outline: none; border-color: var(--saffron); box-shadow: 0 0 0 2px rgba(212,137,26,0.15); }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 500px) { .form-row, .form-row-3 { grid-template-columns: 1fr; } }
  .form-section { margin: 20px 0 12px; font-family: 'Special Elite', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--ink-mid); border-bottom: 1px solid var(--parchment-dark); padding-bottom: 6px; }
  .checkbox-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  .checkbox-label input { accent-color: var(--saffron); width: 15px; height: 15px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,20,16,0.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--cream); border-radius: 4px; padding: 32px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 6px 6px 0 rgba(26,20,16,0.2); }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin-bottom: 20px; }

  /* Misc */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-light); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }

// ── Image helpers ──────────────────────────────────────────────────────────
function compressImage(file, maxPx = 1200, quality = 0.82) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      const scale = Math.min(1, maxPx / Math.max(width, height));
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

// photos: array of base64 strings. photos[0] is always the hero/cover.
function PhotoUpload({ photos, onChange }) {
  const [loading, setLoading] = useState(false);
  const photoArr = Array.isArray(photos) ? photos : (photos ? [photos] : []);

  async function handleAdd(e) {
    const files = Array.from(e.target.files||[]);
    if (!files.length) return;
    setLoading(true);
    const compressed = await Promise.all(files.map(f => compressImage(f)));
    setLoading(false);
    const valid = compressed.filter(Boolean);
    if (valid.length) onChange([...photoArr, ...valid]);
    e.target.value = "";
  }

  function removePhoto(i) {
    const updated = photoArr.filter((_,idx)=>idx!==i);
    onChange(updated);
  }

  function setHero(i) {
    // Move photo i to index 0
    const updated = [photoArr[i], ...photoArr.filter((_,idx)=>idx!==i)];
    onChange(updated);
  }

  return (
    <div>
      {photoArr.length > 0 && (
        <div className="photo-gallery">
          {photoArr.map((p,i) => (
            <div key={i} className="photo-thumb-wrap">
              <img src={p} alt={`Photo ${i+1}`} className={`photo-thumb${i===0?" photo-thumb-hero":""}`} />
              {i === 0 && <div className="photo-thumb-hero-label">Cover</div>}
              {i > 0 && <button className="photo-set-hero-btn" onClick={()=>setHero(i)} title="Set as cover">★</button>}
              <button className="photo-thumb-remove" onClick={()=>removePhoto(i)} title="Remove">✕</button>
            </div>
          ))}
        </div>
      )}
      <label className="photo-upload-label">
        <input type="file" accept="image/*" multiple onChange={handleAdd} />
        <span className="photo-upload-icon">{loading ? "⏳" : "📷"}</span>
        <span className="photo-upload-text">{loading ? "Processing…" : photoArr.length > 0 ? "Add more photos" : "Tap to add photos"}</span>
        <span className="photo-upload-sub">{photoArr.length > 0 ? `${photoArr.length} photo${photoArr.length>1?"s":""} · tap ★ to set cover` : "Select one or more · tap ★ to set cover"}</span>
      </label>
    </div>
  );
}

// ── Ingredient scaling helpers ─────────────────────────────────────────────
const UNIT_ALIASES = {
  tablespoon:["tbsp","tablespoon","tablespoons","T"],
  teaspoon:["tsp","teaspoon","teaspoons","t"],
  cup:["cup","cups","c"],
  ounce:["oz","ounce","ounces"],
  pound:["lb","lbs","pound","pounds"],
  gram:["g","gram","grams"],
  kilogram:["kg","kilogram","kilograms"],
  milliliter:["ml","milliliter","milliliters","mL"],
  liter:["l","L","liter","liters"],
  pinch:["pinch","pinches"],
};
const UNIT_DISPLAY = { tablespoon:"tbsp", teaspoon:"tsp", cup:"cup", ounce:"oz", pound:"lb", gram:"g", kilogram:"kg", milliliter:"ml", liter:"L", pinch:"pinch" };

function parseIngredient(raw) {
  if (raw === null || raw === undefined) return { amount:null, unitKey:null, unitDisplay:"", name:"", raw:"" };
  if (typeof raw !== "string") raw = String(raw);
  const frac = {"½":0.5,"⅓":1/3,"⅔":2/3,"¼":0.25,"¾":0.75,"⅛":0.125};
  let str = raw.trim();
  Object.entries(frac).forEach(([k,v]) => { str = str.replace(k, String(v)); });
  const numRe = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*/;
  const numMatch = str.match(numRe);
  let amount = null;
  if (numMatch) {
    const ns = numMatch[1].trim();
    if (ns.includes(" ")) { const [w,f] = ns.split(" "); const [n,d] = f.split("/"); amount = +w + +n/+d; }
    else if (ns.includes("/")) { const [n,d] = ns.split("/"); amount = +n/+d; }
    else amount = +ns;
    str = str.slice(numMatch[0].length);
  }
  let unitKey = null, unitRaw = "";
  for (const [key, aliases] of Object.entries(UNIT_ALIASES)) {
    for (const a of aliases) {
      const re = new RegExp(`^${a}s?\\b\\.?\\s*`, "i");
      if (re.test(str)) { unitKey = key; unitRaw = str.match(re)[0]; str = str.slice(unitRaw.length); break; }
    }
    if (unitKey) break;
  }
  return { amount, unitKey, unitDisplay: unitKey ? UNIT_DISPLAY[unitKey] : "", name: str.trim(), raw };
}

function formatAmount(amount, scale, unitKey) {
  if (amount === null) return "";
  const scaled = amount * scale;
  if (unitKey === "teaspoon" || unitKey === "tablespoon" || unitKey === "cup") {
    const fracs = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"]];
    const whole = Math.floor(scaled);
    const rem = scaled - whole;
    const match = fracs.find(([v]) => Math.abs(rem - v) < 0.05);
    if (match) return whole > 0 ? `${whole} ${match[1]}` : match[1];
  }
  if (scaled >= 100) return Math.round(scaled).toString();
  if (Number.isInteger(scaled) || scaled >= 10) return +scaled.toFixed(1) === Math.round(scaled) ? Math.round(scaled).toString() : scaled.toFixed(1);
  return +scaled.toFixed(2) === Math.round(scaled*10)/10 ? scaled.toFixed(1) : scaled.toFixed(2).replace(/0+$/,"");
}

async function migrateBase64Photo(dataUrl) {
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const filename = Date.now() + "-" + Math.random().toString(36).slice(2,9) + ".jpg";
    const up = await fetch(SUPABASE_URL + "/storage/v1/object/recipe-photos/" + filename, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "image/jpeg" },
      body: blob
    });
    if (up.ok) return SUPABASE_URL + "/storage/v1/object/public/recipe-photos/" + filename;
  } catch(e) {}
  return null;
}

async function syncToSupabase(recipes, pantryItems, calendarData) {
  if (recipes && recipes.length > 0) {
    const migratedRecipes = await Promise.all(recipes.map(async r => {
      if (!r.photos || r.photos.length === 0) return r;
      const migratedPhotos = await Promise.all(r.photos.map(async p => {
        if (p && p.startsWith("data:")) { const url = await migrateBase64Photo(p); return url || null; }
        return p;
      }));
      return { ...r, photos: migratedPhotos.filter(Boolean) };
    }));
    await sbUpsert("recipes", migratedRecipes.map(recipeToRow));
  }
  if (pantryItems && pantryItems.length > 0) {
    const rows = pantryItems.map(p => ({
      id: p.id || ("p" + Math.random().toString(36).slice(2,9)),
      name: p.name,
      category: p.category || "Other",
      status: p.status || "have",
      quantity: p.quantity || "",
      size: p.size || "",
      count: p.count || "",
      notes: p.notes || "",
      auto_deduct: !!p.autoDeduct,
      updated_at: new Date().toISOString()
    }));
    await sbUpsert("pantry", rows);
  }
  if (calendarData && typeof calendarData === "object") {
    const calRows = [];
    const datesTouched = new Set();
    for (const [date, slots] of Object.entries(calendarData)) {
      datesTouched.add(date);
      for (const [slot, entries] of Object.entries(slots)) {
        const arr = Array.isArray(entries) ? entries : (entries && entries.id ? [entries] : []);
        for (const entry of arr) {
          if (entry && entry.id) {
            calRows.push({ date, slot, recipe_id: entry.id, servings: entry.servings || 1, leftover: entry.leftover || false, updated_at: new Date().toISOString() });
          }
        }
      }
    }
    // Calendar supports multiple recipes per date+slot, so we replace per-date:
    // delete all existing rows for each touched date, then insert the current set.
    // This also correctly removes meals that were deleted in the app.
    for (const date of datesTouched) {
      await fetch(`${SUPABASE_URL}/rest/v1/calendar?date=eq.${date}`, { method: "DELETE", headers: sbHeaders() });
    }
    if (calRows.length > 0) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/calendar`, {
        method: "POST",
        headers: { ...sbHeaders(), "Prefer": "return=minimal" },
        body: JSON.stringify(calRows)
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(`Calendar sync failed: ${res.status} ${t.slice(0,150)}`);
      }
    }
  }
}

async function loadFromSupabase() {
  const [recipeRows, pantryRows, calRows] = await Promise.all([
    sbGet("recipes"), sbGet("pantry"), sbGet("calendar")
  ]);
  const recipes = recipeRows.map(rowToRecipe);
  const pantry = pantryRows.map(p => ({ ...p, autoDeduct: !!p.auto_deduct }));
  const calendar = {};
  for (const row of calRows) {
    if (!calendar[row.date]) calendar[row.date] = {};
    if (!calendar[row.date][row.slot]) calendar[row.date][row.slot] = [];
    calendar[row.date][row.slot].push({ id: row.recipe_id, servings: row.servings, leftover: row.leftover });
  }
  return { recipes, pantry, calendar };
}

          <button className="btn btn-ghost" onClick={async()=>{ setSyncing(true); setStatus("ok:Loading from Supabase..."); try { const sbData = await loadFromSupabase(); if(sbData){ if(sbData.recipes&&sbData.recipes.length>0){ localStorage.setItem("recipebook_v3", JSON.stringify({recipes:sbData.recipes})); } if(sbData.pantry&&sbData.pantry.length>0){ localStorage.setItem(PANTRY_KEY, JSON.stringify(sbData.pantry)); } if(sbData.calendar&&Object.keys(sbData.calendar).length>0){ localStorage.setItem(CAL_KEY, JSON.stringify(sbData.calendar)); } setStatus("ok:✓ Pulled " + (sbData.recipes||[]).length + " recipes from cloud!"); setTimeout(()=>window.location.reload(), 1000); } } catch(e){ setStatus("err:Pull failed: "+e.message); } setSyncing(false); }}>↓ Pull from Cloud</button>
          <button className="btn btn-ghost" onClick={disconnect}>Disconnect</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
        <div style={{marginTop:16,padding:"12px 14px",background:"var(--parchment-dark)",borderRadius:4,fontSize:13}}>
          <div style={{fontWeight:700,marginBottom:4}}>✓ Sync is active</div>
          <div style={{color:"var(--ink-light)"}}>Data syncs automatically on every change across all your devices.</div>
        </div>
      </div>
    </div>
  );
}



// ── Recipe normalizer ────────────────────────────────────────────────────
// Converts any format Claude might return into our clean string-based format
function normalizeRecipe(r) {
  function ingToString(ing) {
    if (!ing) return "";
    if (typeof ing === "string") return ing;
    if (typeof ing === "object") {
      const amt = ing.amount != null ? String(ing.amount).trim() : "";
      const unit = (ing.unit || ing.measurement || "").trim();
      const name = (ing.name || ing.ingredient || ing.item || ing.description || "").trim();
      // Skip unit if it's "whole" or empty — just use amount + name
      const unitClean = ["whole","piece","pieces"].includes(unit.toLowerCase()) ? "" : unit;
      return [amt, unitClean, name].filter(Boolean).join(" ").trim();
    }
    return String(ing);
  }
  function stepToString(s) {
    if (!s) return "";
    if (typeof s === "string") return s;
    if (typeof s === "object") {
      if (s.instructions) return s.title ? s.title + ": " + s.instructions : s.instructions;
      if (s.content) return s.title ? s.title + ": " + s.content : s.content;
      return s.instruction || s.text || s.description || s.title || JSON.stringify(s);
    }
    return String(s);
  }
  const title = r.title || r.name || "Untitled";
  const prepTime = Number(r.prepTime || r.prep_time || r.prep_time_minutes || r.prepTimeMinutes || 0);
  const cookTime = Number(r.cookTime || r.cook_time || r.cook_time_minutes || r.cookTimeMinutes || 0);
  const servings = Number(r.servings || r.yield || r.serves || 4);
  const cuisine = r.cuisine || r.recipeCuisine || "";
  const description = r.description || r.summary || "";
  const extraTags = r.meal_prep_notes ? ["meal-prep"] : [];
  const tags = [...(Array.isArray(r.tags) ? r.tags : []), ...extraTags];
  return {
    ...r,
    title, description, cuisine, prepTime, cookTime, servings, tags,
    ingredients: Array.isArray(r.ingredients) ? r.ingredients.map(ingToString).filter(Boolean) : [],
    steps: Array.isArray(r.steps) ? r.steps.map(stepToString).filter(Boolean) : [],
    diets: Array.isArray(r.diets) ? r.diets : [],
    categories: Array.isArray(r.categories) ? r.categories : [],
    calories: r.calories != null ? (parseInt(String(r.calories).replace(/[^0-9.]/g,""))||null) : null,
    protein: r.protein != null ? (parseInt(String(r.protein).replace(/[^0-9.]/g,""))||null) : null,
    carbs: r.carbs != null ? (parseInt(String(r.carbs).replace(/[^0-9.]/g,""))||null) : null,
    fat: r.fat != null ? (parseInt(String(r.fat).replace(/[^0-9.]/g,""))||null) : null,
    fiber: r.fiber != null ? (parseInt(String(r.fiber).replace(/[^0-9.]/g,""))||null) : null,
    sugar: r.sugar != null ? (parseInt(String(r.sugar).replace(/[^0-9.]/g,""))||null) : null,
    sodium: r.sodium != null ? (parseInt(String(r.sodium).replace(/[^0-9.]/g,""))||null) : null,
    photo: r.photo || (Array.isArray(r.photos) && r.photos[0]) || null,
    photos: Array.isArray(r.photos) ? r.photos : (r.photo ? [r.photo] : []),
    source: r.source || r.url || r.sourceUrl || "",
  };
}

// ── Storage ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = "recipebook_v3";
function loadData() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    if (r) {
      const d = JSON.parse(r);
      // Normalize all recipes on load to fix any bad data from previous imports
      return {...d, recipes: (d.recipes||[]).map(normalizeRecipe)};
    }
  } catch {}
  return { recipes: SAMPLE_RECIPES };
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }
function uid() { return "r" + Math.random().toString(36).slice(2,9); }

// ── App ────────────────────────────────────────────────────────────────────
function RecipeBook() {
  const [data, setData] = useState(() => loadData());
  const [tab, setTab] = useState("library");
  const [search, setSearch] = useState("");
  const [filterCuisine, setFilterCuisine] = useState("");
  const [filterTag, setFilterTag] = useState("");
  const [filterDiet, setFilterDiet] = useState("");
  const [filterCategory, setFilterCategory] = useState("");
  const [filterFavorites, setFilterFavorites] = useState(false);
  const [selectedRecipe, setSelectedRecipe] = useState(null);

  // Handle browser back button
  useEffect(() => {
    function onPopState(e) {
      if (selectedRecipe) {
        setSelectedRecipe(null);
      }
    }
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, [selectedRecipe]);
  const [showSync, setShowSync] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [editRecipe, setEditRecipe] = useState(null);
  const [cookMode, setCookMode] = useState(null);
  const [dinnerSelection, setDinnerSelection] = useState([]);
  const [dinnerCookMode, setDinnerCookMode] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [showGitHubSettings, setShowGitHubSettings] = useState(false);
  const [githubPrefs, setGitHubPrefs] = useState(()=>loadSyncPrefs());
  const [syncStatus, setSyncStatus] = useState(''); // '', 'syncing', 'ok', 'error'
  const githubReady = useRef(false); // true only after startup GitHub load completes
  const blockSave = useRef(false);
  const [pantryVersion, setPantryVersion] = useState(0);
  const [calVersion, setCalVersion] = useState(0);
  function openLightbox(photo, photos, index) {
    setLightbox({ src: photo, photos: photos||[photo], index: index||0 });
  }
  const recipes = data.recipes;
  // Load from Supabase on startup if enabled
  useEffect(() => {
    async function loadFromSB() {
      const prefs = loadSyncPrefs();
      if (!prefs.enabled) { githubReady.current = true; return; }
      try {
        setSyncStatus("syncing");
        // First: migrate any base64 photos from localStorage to Supabase Storage
        try {
          const localData = JSON.parse(localStorage.getItem("recipebook_v3")||"{}");
          const localRecipes = localData.recipes || [];
          const hasBase64 = localRecipes.some(r => (r.photos||[]).some(p => p && p.startsWith("data:")));
          if (hasBase64) {
            const migrated = await Promise.all(localRecipes.map(async r => {
              if (!r.photos || r.photos.length === 0) return r;
              const photos = await Promise.all(r.photos.map(async p => {
                if (p && p.startsWith("data:")) { const url = await migrateBase64Photo(p); return url || p; }
                return p;
              }));
              return { ...r, photos };
            }));
            await sbUpsert("recipes", migrated.map(recipeToRow));
          }
        } catch(migrateErr) { console.warn("Photo migration failed:", migrateErr); }
        const sbData = await loadFromSupabase();
        if (sbData) {
          if (sbData.recipes && sbData.recipes.length > 0) {
            const normalized = sbData.recipes.map(normalizeRecipe);
            const existing = JSON.parse(localStorage.getItem("recipebook_v3")||"{}");
            const existingIds = JSON.stringify((existing.recipes||[]).map(r=>r.id+r.calories+r.cuisine).sort());
            const newIds = JSON.stringify(normalized.map(r=>r.id+r.calories+r.cuisine).sort());
            setSyncStatus("ok:Loaded " + normalized.length + " recipes. Match: " + (existingIds===newIds));
            setTimeout(()=>setSyncStatus(""), 5000);
            if (existingIds !== newIds) {
              localStorage.setItem("recipebook_v3", JSON.stringify({...existing, recipes: normalized}));
              window.location.reload();
              return;
            }
            setData(d => ({...d, recipes: normalized}));
          }
          if (Array.isArray(sbData.pantry) && sbData.pantry.length > 0) {
            localStorage.setItem(PANTRY_KEY, JSON.stringify(sbData.pantry));
            setPantryVersion(v=>v+1);
          }
          if (sbData.calendar && Object.keys(sbData.calendar).length > 0) {
            localStorage.setItem(CAL_KEY, JSON.stringify(sbData.calendar));
            setCalVersion(v=>v+1);
          }
        }
        setSyncStatus("ok");
        setTimeout(()=>setSyncStatus(""), 2000);
        // Delay enabling auto-sync so startup setData doesn't trigger a write-back
        setTimeout(()=>{ githubReady.current = true; }, 1500);
      } catch(e) {
        githubReady.current = true;
        setSyncStatus("error:" + e.message);
        setTimeout(()=>setSyncStatus(""), 5000);
      }
    }
    loadFromSB();
  }, []);

  // Save to localStorage on every data change (skip during startup load)
  useEffect(() => {
    if (!blockSave.current) saveData(data);
  }, [data]);

  function toggleFavorite(id) {
    setData(d => {
      const updated = {...d, recipes: d.recipes.map(r => r.id===id ? {...r, favorite:!r.favorite} : r)};
      // Keep selectedRecipe in sync
      if (selectedRecipe?.id === id) {
        const found = updated.recipes.find(r => r.id===id);
        if (found) setSelectedRecipe(found);
      }
      return updated;
    });
  }

  function findDuplicate(title, excludeId) {
    if (!title) return null;
    const norm = t => t.toLowerCase().replace(/[^a-z0-9]/g,"");
    const a = norm(title);
    return recipes.find(r => r.id !== excludeId && (() => {
      const b = norm(r.title);
      if (a === b) return true;
      // Check if one contains the other (handles "Ed's Nashville Chicken" vs "Nashville Chicken")
      if (a.length > 6 && b.length > 6 && (a.includes(b) || b.includes(a))) return true;
      // Levenshtein-lite: if strings are very close in length and share 85%+ chars
      if (Math.abs(a.length - b.length) <= 3) {
        let matches = 0;
        for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) matches++;
        if (matches / Math.max(a.length, b.length) > 0.85) return true;
      }
      return false;
    })());
  }

  async function upsertRecipe(r) {
    setData(d => { const e = d.recipes.find(x=>x.id===r.id); return {...d, recipes: e ? d.recipes.map(x=>x.id===r.id?r:x) : [r,...d.recipes]}; });
    // Sync this recipe directly to Supabase
    const prefs = loadSyncPrefs();
    if (prefs.enabled) {
      try {
        setSyncStatus("syncing");
        await sbUpsert("recipes", [recipeToRow(r)]);
        setSyncStatus("ok"); setTimeout(()=>setSyncStatus(""), 2000);
      } catch(e) { setSyncStatus("error:" + e.message); setTimeout(()=>setSyncStatus(""), 5000); }
    }
    // If we're viewing this recipe, refresh it
    if (selectedRecipe?.id === r.id) setSelectedRecipe(r); // no history push on edit save
  }
  function quickPhoto(id, photo, photos) {
    const p = photos || [photo];
    setData(d=>({...d, recipes:d.recipes.map(r=>r.id===id?{...r,photo:p[0],photos:p}:r)}));
    if(selectedRecipe?.id===id) setSelectedRecipe(r=>({...r,photo:p[0],photos:p}));
  }

  async function deleteRecipe(id) {
    if(!window.confirm('Delete this recipe? This cannot be undone.')) return;
    setData(d=>({...d,recipes:d.recipes.filter(x=>x.id!==id)}));
    if(selectedRecipe?.id===id) setSelectedRecipe(null);

    // Strip any calendar entries pointing at this recipe so deleted recipes
    // can't leave orphaned "Recipe not found" rows behind.
    try {
      const cal = loadCalendar();
      let changed = false;
      for (const date of Object.keys(cal)) {
        for (const slot of Object.keys(cal[date])) {
          const entries = Array.isArray(cal[date][slot]) ? cal[date][slot] : [cal[date][slot]];
          const filtered = entries.filter(e => e && e.id !== id);
          if (filtered.length !== entries.length) {
            changed = true;
            if (filtered.length === 0) delete cal[date][slot];
            else cal[date][slot] = filtered;
          }
        }
        if (Object.keys(cal[date]).length === 0) delete cal[date];
      }
      if (changed) { saveCalendar(cal); setCalVersion(v=>v+1); }
    } catch(e) { console.warn("Calendar cleanup failed:", e); }

    // Also delete from Supabase
    const prefs = loadSyncPrefs();
    if (prefs.enabled) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/recipes?id=eq.${id}`, {
          method: "DELETE",
          headers: sbHeaders()
        });
        // Clean up any calendar rows referencing the deleted recipe too,
        // so a stale row can't resurface on the next pull from another device.
        await fetch(`${SUPABASE_URL}/rest/v1/calendar?recipe_id=eq.${id}`, {
          method: "DELETE",
          headers: sbHeaders()
        });
      } catch(e) { console.warn("Supabase delete failed:", e); }
    }
  }

  const cuisines = [...new Set(recipes.map(r=>r.cuisine).filter(Boolean))];
  const allTags = [...new Set(recipes.flatMap(r=>r.tags||[]))];
  const allDiets = [...new Set(recipes.flatMap(r=>r.diets||[]))];
  const allCategories = [...new Set(recipes.flatMap(r=>r.categories||[]))];
  const filtered = recipes.filter(r => {
    const q = search.toLowerCase();
    return (!q || r.title.toLowerCase().includes(q) || (r.tags||[]).some(t=>t.includes(q)) || (r.cuisine||"").toLowerCase().includes(q))
      && (!filterCuisine || r.cuisine===filterCuisine)
      && (!filterTag || (r.tags||[]).includes(filterTag))
      && (!filterDiet || (r.diets||[]).includes(filterDiet))
      && (!filterCategory || (r.categories||[]).includes(filterCategory))
      && (!filterFavorites || r.favorite === true);
  });

  function startCookMode(recipe) {
    try {
      const r = normalizeRecipe(recipe);
      const steps = (r.steps||[]).map((s,i)=>{
        const text = typeof s === "string" ? s : (s && s.content ? s.content : String(s||""));
        let matched = [];
        try { matched = matchIngredients(text, r.ingredients||[]); } catch(e) {}
        return { text, num:i+1, recipe:r.title||"", photo:r.photo||null, matchedIngs:matched };
      });
      if(steps.length === 0) { alert("This recipe has no steps yet."); return; }
      setCookMode({ recipe:r, steps, currentIndex:0 });
    } catch(e) {
      alert("Could not start cook mode: " + e.message);
    }
  }
  function buildDinnerSteps(ids) {
    const sel = ids.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);
    const colorMap = {}; sel.forEach((r,i)=>{colorMap[r.id]=COLORS[i%COLORS.length];});
    const all = []; sel.forEach(r=>{ r.steps.forEach((text,idx)=>{ all.push({text,recipe:r.title,recipeId:r.id,color:colorMap[r.id],stepNum:idx+1,totalSteps:r.steps.length,globalOrder:idx/r.steps.length,photo:r.photo,matchedIngs:matchIngredients(text,r.ingredients)}); }); });
    all.sort((a,b)=>a.globalOrder-b.globalOrder || sel.findIndex(r=>r.id===a.recipeId)-sel.findIndex(r=>r.id===b.recipeId));
    return all;
  }

  return (
    <>
      <style>{STYLES}</style>
      <div className="app">
        <header className="header">
          <div>
            <div className="header-title" onClick={()=>{ const n=titleTapCount+1; setTitleTapCount(n); if(n>=5){setShowClaudeCommand(true);setTitleTapCount(0);} setTimeout(()=>setTitleTapCount(0),3000); }}>The <span>Recipe</span> Book</div>
            <div className="header-sub">your kitchen, organized & intelligently guided</div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            {syncStatus==="syncing"&&<span style={{fontSize:12,color:"var(--ink-light)"}}>⟳ Syncing…</span>}
            {syncStatus==="ok"&&<span style={{fontSize:12,color:"var(--sage)"}}>✓ Synced</span>}
            {syncStatus.startsWith("error")&&<span style={{fontSize:11,color:"var(--rust)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={syncStatus.split(":").slice(1).join(":")}>⚠ {syncStatus.split(":").slice(1).join(":").slice(0,30)||"Sync failed"}</span>}
            <button className="btn-header" onClick={()=>setShowGitHubSettings(true)} title="GitHub Sync Settings">
              {githubPrefs.enabled?"☁️":"☁️"} Sync
            </button>
            <button className="btn-header" onClick={()=>setShowSync(true)}>⇅ Share</button>
            <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>+ Add Recipe</button>
          </div>
        </header>
        <nav className="nav-tabs">
          {[["library","📚 Library"],["discover","✨ AI Discovery"],["dinner","🍽 Dinner Planner"],["import","📥 Import"],["pantry","🥫 Pantry"],["calendar","📅 Calendar"]].map(([id,label])=>(
            <button key={id} className={`nav-tab${tab===id?" active":""}`} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </nav>
        {tab==="library" && <LibraryTab recipes={filtered} cuisines={cuisines} allTags={allTags} allDiets={allDiets} search={search} setSearch={setSearch} filterCuisine={filterCuisine} setFilterCuisine={setFilterCuisine} filterTag={filterTag} setFilterTag={setFilterTag} filterDiet={filterDiet} setFilterDiet={setFilterDiet} filterCategory={filterCategory} setFilterCategory={setFilterCategory} allCategories={allCategories} filterFavorites={filterFavorites} setFilterFavorites={setFilterFavorites} onToggleFavorite={toggleFavorite} selectedRecipe={selectedRecipe} setSelectedRecipe={setSelectedRecipe} onEdit={setEditRecipe} onDelete={deleteRecipe} onCook={startCookMode} onLightbox={openLightbox} onToggleFavorite={toggleFavorite} onQuickPhoto={quickPhoto} />}
        {tab==="discover" && <DiscoverTab recipes={recipes} onAddRecipe={r=>{
          const dup = findDuplicate(r.title, r.id);
          if (dup) {
            if (!window.confirm(`"${dup.title}" looks similar to "${r.title}". Save anyway?`)) return;
          }
          upsertRecipe(r); setTab("library");
        }} />}
        {tab==="dinner" && <DinnerTab recipes={recipes} selection={dinnerSelection} setSelection={setDinnerSelection} onStartCook={()=>{ if(dinnerSelection.length<2)return; setDinnerCookMode({steps:buildDinnerSteps(dinnerSelection),currentIndex:0}); }} />}
        {tab==="import" && <ImportTab onImport={r=>{
          const dup = findDuplicate(r.title, r.id);
          if (dup) {
            if (!window.confirm(`"${dup.title}" looks like a duplicate of "${r.title}". Save anyway?`)) return;
          }
          upsertRecipe(r); setEditRecipe(r); setTab("library");
        }} />}
        {tab==="pantry" && <PantryTab recipes={recipes} version={pantryVersion} />}
        {tab==="calendar" && <CalendarTab recipes={recipes} version={calVersion} onQuickAddRecipe={upsertRecipe} />}
      </div>
      {(showAdd||editRecipe) && <RecipeModal recipe={editRecipe} onSave={r=>{
          // Only check duplicates for new recipes, not edits
          if (!editRecipe) {
            const dup = findDuplicate(r.title, r.id);
            if (dup) {
              if (!window.confirm(`"${dup.title}" looks similar to "${r.title}". Save anyway?`)) return;
            }
          }
          upsertRecipe(r); setShowAdd(false); setEditRecipe(null);
        }} onClose={()=>{setShowAdd(false);setEditRecipe(null);}} />}
      {cookMode && <CookModeOverlay steps={cookMode.steps} currentIndex={cookMode.currentIndex} onNav={dir=>setCookMode(c=>({...c,currentIndex:Math.max(0,Math.min(c.steps.length-1,c.currentIndex+dir))}))} onClose={()=>setCookMode(null)} />}
      {dinnerCookMode && <CookModeOverlay steps={dinnerCookMode.steps} currentIndex={dinnerCookMode.currentIndex} onNav={dir=>setDinnerCookMode(c=>({...c,currentIndex:Math.max(0,Math.min(c.steps.length-1,c.currentIndex+dir))}))} onClose={()=>setDinnerCookMode(null)} isDinner />}
      {showSync && <SyncModal data={data} onImport={imported=>{
        // Merge: add recipes not already present by id
        setData(d=>{
          const existingIds = new Set(d.recipes.map(r=>r.id));
          const newRecipes = imported.filter(r=>!existingIds.has(r.id));
          return {...d, recipes:[...d.recipes, ...newRecipes]};
        });
      }} onReplace={imported=>{
        setData(d=>({...d, recipes:imported}));
      }} onClose={()=>setShowSync(false)} />}
      {showGitHubSettings && <GitHubSettingsModal
        onClose={()=>setShowGitHubSettings(false)}
        onSaved={prefs=>{ setGitHubPrefs(prefs); }}
        recipes={data.recipes||[]}
      />}
      {lightbox && <Lightbox photos={lightbox.photos||[lightbox.src||lightbox]} startIndex={lightbox.index||0} onClose={()=>setLightbox(null)} />}
    </>
  );
}

// ── Library Tab ────────────────────────────────────────────────────────────
function LibraryTab({recipes,cuisines,allTags,allDiets,allCategories,search,setSearch,filterCuisine,setFilterCuisine,filterTag,setFilterTag,filterDiet,setFilterDiet,filterCategory,setFilterCategory,filterFavorites,setFilterFavorites,onToggleFavorite,selectedRecipe,setSelectedRecipe,onEdit,onDelete,onCook,onLightbox,onQuickPhoto}) {
  const [sortBy, setSortBy] = useState('newest');
  return (
    <div>
      <div className="toolbar">
        <input className="search-input" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} />
        <select className="filter-select" value={filterCuisine} onChange={e=>setFilterCuisine(e.target.value)}>
          <option value="">Cuisine</option>{cuisines.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="filter-select" value={filterTag} onChange={e=>setFilterTag(e.target.value)}>
          <option value="">Tag</option>{allTags.map(t=><option key={t}>{t}</option>)}
        </select>
        <select className="filter-select" value={filterDiet} onChange={e=>setFilterDiet(e.target.value)}>
          <option value="">Diet</option>{allDiets.map(d=><option key={d}>{d}</option>)}
        </select>
        <select className="filter-select" value={filterCategory} onChange={e=>setFilterCategory(e.target.value)}>
          <option value="">Category</option>{allCategories.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="filter-select" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
          <option value="newest">↓ Newest</option>
          <option value="oldest">↑ Oldest</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="cuisine">Cuisine</option>
          <option value="fastest">⏱ Fastest</option>
          <option value="calories">🔥 Calories</option>
        </select>
        <button className={`fav-filter-btn${filterFavorites?" active":""}`} onClick={()=>setFilterFavorites(f=>!f)}>❤️</button>
      </div>
      {selectedRecipe ? (
        <RecipeDetail recipe={selectedRecipe} onBack={()=>setSelectedRecipe(null)} onEdit={onEdit} onDelete={onDelete} onCook={onCook} onLightbox={onLightbox} onToggleFavorite={onToggleFavorite} onQuickPhoto={onQuickPhoto} />
      ) : recipes.length===0 ? (

// ── Ingredient amount parser (for cook mode display) ─────────────────────
function parseIngAmount(ing) {
  if (!ing || typeof ing !== "string") return { amount: "", name: ing || "" };
  const frac = {"½":"1/2","⅓":"1/3","⅔":"2/3","¼":"1/4","¾":"3/4","⅛":"1/8"};
  let s = ing.trim();
  Object.entries(frac).forEach(([k,v])=>{ s=s.replace(k,v); });
  const units = "tbsp|tsp|cups?|oz|lbs?|kg|g|ml|l|pinch|pinches|whole|large|medium|small|cloves?|heads?|bunch|bunches|pieces?|strips?|cans?|jars?";
  const re = new RegExp("^([\\d\\s/.-]+(?:\\s*(?:" + units + "))?)\\s*(.*)$","i");
  const m = s.match(re);
  if (m) return { amount: m[1].trim(), name: m[2].replace(/^[,\s]+/,"").trim() };
  return { amount: "", name: ing };
}

// ── Ingredient matcher ────────────────────────────────────────────────────
function extractKeywords(ing) {
  if (!ing || typeof ing !== "string") return [];
  let s = ing.replace(/^[\d\s/½⅓⅔¼¾⅛.]+/, "");
  s = s.replace(/\b(tbsp|tsp|cups?|oz|lbs?|kg|g|ml|l|pinch|whole|large|medium|small|fresh|dried|finely|chopped|diced|minced|grated|sliced|boneless|skinless)\b/gi, "");
  s = s.replace(/[,(].*/, "");
  return s.split(/\s+/).map(w=>w.toLowerCase().trim()).filter(w=>w.length>2);
}

function matchIngredients(stepText, ingredients) {
  if (!stepText || typeof stepText !== "string") return [];
  const stepLower = stepText.toLowerCase();
  return (ingredients||[]).filter(ing => {
    if (!ing || typeof ing !== "string") return false;
    const keywords = extractKeywords(ing);
    return keywords.some(kw => new RegExp("\\b" + kw, "i").test(stepLower));
  });
}

// ── Cook Mode ──────────────────────────────────────────────────────────────
function CookModeOverlay({steps,currentIndex,onNav,onClose,isDinner}) {
  const step = steps[currentIndex];
  const wakeLockRef = useRef(null);
  const [wakeLockActive, setWakeLockActive] = useState(false);
  const [wakeLockSupported] = useState(()=>"wakeLock" in navigator);
  useEffect(()=>{
    async function acquire() { try { wakeLockRef.current = await navigator.wakeLock.request("screen"); setWakeLockActive(true); wakeLockRef.current.addEventListener("release",()=>setWakeLockActive(false)); } catch {} }
    if(wakeLockSupported) acquire();
    return ()=>{ wakeLockRef.current?.release(); };
  },[wakeLockSupported]);
  useEffect(()=>{
    async function reacquire() { if(wakeLockSupported && document.visibilityState==="visible") { try { wakeLockRef.current = await navigator.wakeLock.request("screen"); setWakeLockActive(true); wakeLockRef.current.addEventListener("release",()=>setWakeLockActive(false)); } catch {} } }
    document.addEventListener("visibilitychange",reacquire);
    return ()=>document.removeEventListener("visibilitychange",reacquire);
  },[wakeLockSupported]);

  return (
    <div className="cook-mode-overlay">
      <div className="cook-header">
        <div><div className="cook-title">{isDinner?"Dinner Cook Mode":"Cook Mode"}</div><div className="cook-recipe-name">{step.recipe}</div></div>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          {wakeLockSupported && <div style={{fontSize:16,opacity:wakeLockActive?1:0.35}}>{wakeLockActive?"☀️":"🌑"}</div>}
          <div className="cook-progress">{steps.map((_,i)=><div key={i} className={`cook-dot${i<currentIndex?" done":i===currentIndex?" current":""}`}/>)}</div>
          <button className="btn-icon" style={{color:'rgba(255,255,255,0.5)',fontSize:24}} onClick={onClose}>✕</button>
        </div>
      </div>
      <div className="cook-body">
        {step.photo && <img src={step.photo} alt={step.recipe} className="cook-photo" />}
        <div className="cook-step-num">{step.num||(currentIndex+1)}</div>
        {isDinner && <div className="cook-recipe-label" style={{color:step.color||'var(--saffron)'}}>{step.recipe}</div>}
        <div className="cook-step-text">{step.text}</div>
        {step.matchedIngs && step.matchedIngs.length > 0 && (
          <div className="cook-ingredients">
            {step.matchedIngs.map((ing,i) => {
              const {amount, name} = parseIngAmount(ing);
              return (
                <div key={i} className="cook-ing-chip">
                  {amount && <span className="cook-ing-amount">{amount}</span>}
                  <span className="cook-ing-name">{name}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div className="cook-nav">
        <button className="cook-nav-btn cook-prev" onClick={()=>onNav(-1)} style={{opacity:currentIndex===0?0.3:1}}>← Prev</button>
        <span style={{color:'rgba(255,255,255,0.4)',fontSize:13}}>{currentIndex+1} / {steps.length}</span>
        {currentIndex<steps.length-1 ? <button className="cook-nav-btn cook-next" onClick={()=>onNav(1)}>Next →</button> : <button className="cook-nav-btn cook-next" onClick={onClose}>Done ✓</button>}
      </div>
    </div>
  );
}

  const filtered = recipes.filter(r => {
    const q = search.toLowerCase();
    return (!q || r.title.toLowerCase().includes(q) || (r.cuisine||"").toLowerCase().includes(q) || (r.tags||[]).some(t=>t.includes(q)))
      && (!filterCat || (r.categories||[]).includes(filterCat) || (r.tags||[]).includes(filterCat));
  });

  const allCats = [...new Set(recipes.flatMap(r=>r.categories||[]))];

  function buildPreview(sel) {
    const colorMap={}; sel.forEach((r,i)=>{colorMap[r.id]=COLORS[i%COLORS.length];});
    const steps=[]; sel.forEach(r=>{r.steps.forEach((text,idx)=>steps.push({text,recipe:r.title,recipeId:r.id,color:colorMap[r.id],stepNum:idx+1,globalOrder:idx/r.steps.length}));});
    steps.sort((a,b)=>a.globalOrder-b.globalOrder||sel.findIndex(r=>r.id===a.recipeId)-sel.findIndex(r=>r.id===b.recipeId));
    return steps;
  }

  return (
    <div>

            <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Dinner Planner</div>
            <div style={{fontSize:12,color:"var(--ink-light)"}}>{selection.length===0?"Pick 2–6 dishes below":selection.length===1?"Pick 1 more to start":`${selection.length} dishes selected`}</div>

          <button
            className="btn btn-primary"
            disabled={selection.length < 2}
            style={{opacity:selection.length<2?0.4:1}}
            onClick={onStartCook}
          >
            ▶ Cook Together
          </button>
        </div>

        {/* Selected dishes chips */}
        {selectedRecipes.length > 0 ? (
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {selectedRecipes.map((r,i)=>{
              const photos = r.photos&&r.photos.length>0?r.photos:(r.photo?[r.photo]:[]);
              return (
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px 4px 4px",borderRadius:20,background:COLORS[i%COLORS.length]+"22",border:`1.5px solid ${COLORS[i%COLORS.length]}`,cursor:"pointer"}} onClick={()=>toggle(r.id)}>

                  <span style={{fontSize:11,color:COLORS[i%COLORS.length],fontWeight:700}}>✕</span>
                </div>
              );
            })}
          </div>
        ) : (
          <div style={{fontSize:12,color:"var(--ink-light)",fontStyle:"italic"}}>No dishes selected yet — tap any recipe below</div>
        )}
      </div>

      {/* ── Search & filter ── */}
      <div className="toolbar" style={{marginBottom:16}}>
        <input className="search-input" placeholder="Search recipes…" value={search} onChange={e=>setSearch(e.target.value)} />
        {allCats.length>0&&<select className="filter-select" value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
          <option value="">All</option>
          {allCats.map(c=><option key={c}>{c}</option>)}

      </div>

      {/* ── Recipe grid ── */}
      <div className="recipe-grid" style={{marginBottom:24}}>
        {filtered.map(r=>(
          <div key={r.id} className={`recipe-card${selection.includes(r.id)?" selected":""}`} onClick={()=>toggle(r.id)}>
            {(()=>{
              const photos=r.photos&&r.photos.length>0?r.photos:(r.photo?[r.photo]:[]);
              return photos.length>0
                ? <img src={photos[0]} alt={r.title} className="recipe-card-photo" style={{height:120}} />
                : <div className="recipe-card-photo-placeholder" style={{height:80}}>{recipeEmoji(r)}</div>;
            })()}
            <div className="recipe-card-body">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div className="recipe-card-title" style={{flex:1,paddingRight:8}}>{r.title}</div>
                <div style={{width:26,height:26,borderRadius:"50%",flexShrink:0,
                  background:selection.includes(r.id)?COLORS[selection.indexOf(r.id)%COLORS.length]:"transparent",
                  border:selection.includes(r.id)?"none":"2px solid var(--parchment-dark)",
                  display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12,fontWeight:700}}>
                  {selection.includes(r.id)?(selection.indexOf(r.id)+1):""}
                </div>
              </div>
              <div className="recipe-card-meta">
                {r.cuisine&&<span>{r.cuisine}</span>}
                {r.prepTime!=null&&<span>⏱ {(r.prepTime||0)+(r.cookTime||0)} min</span>}
                {r.calories&&<span>🔥 {r.calories} cal</span>}
              </div>
            </div>
          </div>
        ))}
        {filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:40,color:"var(--ink-light)"}}>No recipes match your search.</div>}
      </div>

      {/* ── Interleaved preview (only when 2+ selected) ── */}
      {selection.length >= 2 && (
        <div className="detail-panel" style={{overflow:"hidden"}}>
          <div style={{padding:"16px 20px",borderBottom:"1px solid var(--parchment-dark)"}}>
            <div style={{fontFamily:"'Special Elite',monospace",textTransform:"uppercase",letterSpacing:2,fontSize:12,color:"var(--ink-mid)"}}>Step Preview — how they interleave</div>
          </div>
          <div style={{padding:"0 20px 20px"}}>
            <div style={{marginTop:16,display:"flex",gap:10,flexWrap:"wrap"}}>
              {selectedRecipes.map((r,i)=>(
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:20,background:COLORS[i%COLORS.length]+"22",border:`1px solid ${COLORS[i%COLORS.length]}`}}>
                  <span className="color-swatch" style={{background:COLORS[i%COLORS.length]}}></span>
                  <span style={{fontSize:12,fontWeight:700}}>{r.title}</span>
                  <span style={{fontSize:11,opacity:0.7}}>{r.steps.length} steps</span>
                </div>
              ))}
            </div>
            <div style={{marginTop:12}}>
              {buildPreview(selectedRecipes).map((s,i)=>(
                <div key={i} className="orch-entry">
                  <div className="orch-badge" style={{background:s.color,fontSize:11}}>{s.stepNum}</div>
                  <div><div className="orch-recipe-name" style={{color:s.color}}>{s.recipe}</div><div className="orch-step-text">{s.text}</div></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── AI Discovery ───────────────────────────────────────────────────────────
function DiscoverTab({recipes,onAddRecipe}) {
  // ── Preferences ───────────────────────────────────────────────────────────
  const [prefs, setPrefs] = useState(() => {

  });
  function savePrefs(p) { setPrefs(p); try { localStorage.setItem("recipebook_prefs", JSON.stringify(p)); } catch {} }

  // ── State ─────────────────────────────────────────────────────────────────
  const STAGES = {SETUP:0, PROTEIN:1, COOKER:2, FLAVOR:3, OCCASION:4, DETAILS:5, IDEAS:6, RECIPE:7};
  const [stage, setStage] = useState(STAGES.SETUP);
  const [selections, setSelections] = useState({protein:"",cooker:"",flavor:[],occasion:"",notes:"",servings:"4"});
  const [ideas, setIdeas] = useState([]); // [{title, description}]
  const [ideaBatch, setIdeaBatch] = useState(1);
  const [chosenIdea, setChosenIdea] = useState(null);
  const [ideasPasteText, setIdeasPasteText] = useState("");
  const [ideasError, setIdeasError] = useState("");
  const [recipePasteText, setRecipePasteText] = useState("");
  const [result, setResult] = useState(null);
  const [recipeError, setRecipeError] = useState("");
  const [copied, setCopied] = useState("");
  const [savedList, setSavedList] = useState([]);

  const savedTitles = recipes.map(r=>r.title).join(", ");

  // ── Data ──────────────────────────────────────────────────────────────────
  const PROTEINS = [

    {label:"♨️ Oven", value:"oven", notes:""},
    {label:"🔥 Gas/Charcoal Grill", value:"gas or charcoal grill", notes:""},
    {label:"⚡ Instant Pot", value:"Instant Pot pressure cooker", notes:""},
    {label:"🐢 Slow Cooker", value:"slow cooker", notes:""},

      {label:"🍋 Citrus & Bright", value:"citrus, bright, fresh"},
      {label:"🥢 Asian-Inspired", value:"Asian-inspired, soy, ginger"},
      {label:"🍯 Sweet & Savory", value:"sweet and savory, honey or maple"},
      {label:"🫒 Mediterranean", value:"Mediterranean, herbs, olive oil"},
      {label:"🌮 Bold & Smoky", value:"bold and smoky, cumin, paprika"},

  const OCCASIONS = [
    {label:"⚡ Quick Weeknight", value:"quick weeknight (under 30 min)"},

    {label:"📦 Meal Prep", value:"meal prep, makes great leftovers"},
    {label:"❤️ Date Night", value:"romantic date night dinner"},
    {label:"👨‍👩‍👧 Family Dinner", value:"family dinner, crowd pleasing"},
    {label:"🎉 Game Day", value:"game day food, hearty or finger food"},
    {label:"🥗 Light & Healthy", value:"light and healthy"},
  ];

  function getFlavors() { return FLAVORS_BY_COOKER[selections.cooker]||FLAVORS_BY_COOKER.default; }
  function sel(k,v) { setSelections(s=>({...s,[k]:v})); }
  function toggleFlavor(v) { setSelections(s=>({...s,flavor:s.flavor.includes(v)?s.flavor.filter(f=>f!==v):[...s.flavor,v].slice(0,3)})); }

  function getContext() {
    const cookerObj = COOKERS.find(c=>c.value===selections.cooker);
    const cookerNotes = cookerObj?.notes ? ` (${cookerObj.notes})` : "";
    return {
      protein: selections.protein,
      cooker: selections.cooker + cookerNotes,
      flavors: selections.flavor.join(", ") || "chef's choice",
      occasion: selections.occasion,
      servings: selections.servings,
      notes: selections.notes,
      existing: savedTitles ? `My existing recipes: ${savedTitles}. Suggest something different.` : "",
    };
  }

  // Prompt 1: Generate 5 ideas
  function buildIdeasPrompt(batch) {
    const c = getContext();
    const batchNote = batch > 1 ? `\n\nThis is batch ${batch}. I did not like the previous suggestions. Give me 5 completely different ideas.` : "";
    return `I am planning a meal and need recipe ideas. Please suggest 5 options as a simple numbered list — no code, no JSON, just readable text.

My cooking setup:
- Main ingredient: ${c.protein}
- Cooking on: ${c.cooker}
- Flavor I want: ${c.flavors}
- Occasion: ${c.occasion}
- Servings: ${c.servings}
${c.notes ? `- Extra: ${c.notes}` : ""}
${c.existing}${batchNote}

Show me 5 numbered recipe ideas like this:
1. Recipe Name — One or two sentences about what it is and why it sounds good.
2. Recipe Name — One or two sentences.
3. Recipe Name — One or two sentences.
4. Recipe Name — One or two sentences.
5. Recipe Name — One or two sentences.

After the list add this line exactly:
---
Reply with the NUMBER of the recipe you want the full recipe for, or say "5 more" for new ideas.`;
  }

  // Prompt 2: Full recipe for chosen idea
  function buildRecipePrompt(idea) {
    const c = getContext();
    return `I need to import a recipe into my recipe app. The app only accepts raw JSON text — it cannot read formatted recipes, cards, or anything visual.

Recipe to create: "${idea.title}"
Cooking on: ${c.cooker}
Servings: ${c.servings}
${c.notes ? `Notes: ${c.notes}` : ""}

YOUR RESPONSE MUST BE ONLY RAW JSON TEXT. Do not use any formatting, do not create a recipe card, do not use headers or bullets. Just type the JSON starting with { and ending with }. I will copy and paste your raw text response into my app.

Required JSON fields: title (string), cuisine (string), categories (array), servings (number), prepTime (number), cookTime (number), description (string), tags (array), diets (array), calories (number), protein (number), carbs (number), fat (number), fiber (number), ingredients (array of strings with amounts e.g. "2 tbsp butter"), steps (array of strings).
Categories from: Appetizer, Breakfast, Brunch, Lunch, Dinner, Dessert, Snack, Side Dish, Sauce, Topping, Dressing, Marinade, Soup, Salad, Bread, Drink, Other
Diets from: Vegetarian, Vegan, Gluten-Free, Dairy-Free, Keto, Paleo, Nut-Free, Low-Carb, Low-Fat

Start your response with { and end with }. No other text.`;
  }

  async function doCopy(text, key) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value=text; ta.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    }
    setCopied(key); setTimeout(()=>setCopied(""),2500);
  }

  function parseIdeas() {
    setIdeasError(""); setIdeas([]);
    try {
      // Strip markdown code blocks
      let clean = ideasPasteText.replace(/```json|```/g,"").trim();
      // Extract just the JSON array even if Claude added surrounding text
      const arrStart = clean.indexOf("[");
      const arrEnd = clean.lastIndexOf("]");
      if(arrStart !== -1 && arrEnd !== -1) clean = clean.slice(arrStart, arrEnd+1);
      const parsed = JSON.parse(clean);
      if(!Array.isArray(parsed)||!parsed.length) throw new Error();
      // Normalise — handle both {title,description} and flat strings
      const normalised = parsed.map(item => typeof item === "string"
        ? {title:item, description:""}
        : {title:item.title||item.name||"Untitled", description:item.description||item.desc||""}
      );
      setIdeas(normalised);
    } catch { setIdeasError("Could not parse. Paste only Claude's response — it should start with [ and end with ]"); }
  }

  function parseRecipe() {
    setRecipeError(""); setResult(null);
    try {
      let clean = recipePasteText.replace(/```json|```/g,"").trim();
      const s=clean.indexOf("{"),e=clean.lastIndexOf("}");
      if(s!==-1&&e!==-1) clean=clean.slice(s,e+1);
      const parsed = JSON.parse(clean);
      const norm = normalizeRecipe({...parsed,id:uid(),aiGenerated:true,photo:null,photos:[]});
      if(!norm.title||norm.title==="Untitled") throw new Error("No title found");
      if(!norm.steps||!norm.steps.length) throw new Error("No steps found");
      setResult(norm);
    } catch(e) { setRecipeError("Could not parse: " + e.message + ". If pasting from Claude, make sure you copy only the JSON (starting with { and ending with })."); }
  }

  function saveResult() {
    if(!result) return;
    onAddRecipe(result);
    setSavedList(s=>[...s,result.title]);
    setResult(null); setRecipePasteText("");
  }

  function resetWizard() {
    setStage(STAGES.SETUP);
    setSelections({protein:"",cooker:prefs.defaultCooker||"",flavor:[],occasion:"",notes:"",servings:"4"});

  // ── Shared styles ─────────────────────────────────────────────────────────

    </div>

  const backBtn = (to) => <button className="btn btn-ghost btn-sm" style={{marginBottom:16}} onClick={()=>setStage(to)}>← Back</button>;

  // ── SETUP ─────────────────────────────────────────────────────────────────
  if(stage===STAGES.SETUP) return (
    <div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,marginBottom:4}}>✨ Recipe Builder</div>
      <p className="text-muted" style={{marginBottom:20}}>Answer a few questions — we'll suggest 5 recipe ideas, you pick one, we build the full recipe.</p>
      <div className="ai-panel" style={{marginBottom:16}}>
        <div style={{fontFamily:"'Special Elite',monospace",fontSize:12,textTransform:'uppercase',letterSpacing:2,color:'var(--saffron)',marginBottom:12}}>Your Equipment</div>
        <div style={chipGrid}>
          {COOKERS.map(c=>(
            <div key={c.value} style={chipStyle((prefs.equipment||[]).includes(c.value))} onClick={()=>{
              const eq=prefs.equipment||[];
              savePrefs({...prefs,equipment:eq.includes(c.value)?eq.filter(x=>x!==c.value):[...eq,c.value]});
            }}>
              {c.label}{(prefs.equipment||[]).includes(c.value)&&<span style={{marginLeft:'auto',fontSize:12}}>✓</span>}
            </div>
          ))}
        </div>
        {(prefs.equipment||[]).length>0&&(
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:1,color:'var(--ink-mid)',marginBottom:8}}>Default cooker</div>
            <select className="filter-select" style={{width:'100%'}} value={prefs.defaultCooker||""} onChange={e=>savePrefs({...prefs,defaultCooker:e.target.value})}>
              <option value="">Ask me each time</option>
              {(prefs.equipment||[]).map(eq=>{const c=COOKERS.find(x=>x.value===eq);return <option key={eq} value={eq}>{c?.label||eq}</option>;})}
            </select>
          </div>
        )}
        <button className="btn btn-primary" onClick={()=>{setSelections(s=>({...s,cooker:prefs.defaultCooker||""}));setStage(STAGES.PROTEIN);}}>
          Start Building →
        </button>
      </div>
      {savedList.length>0&&<div className="ai-panel"><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:1,color:'var(--sage)',marginBottom:8}}>✓ Saved this session</div>{savedList.map((t,i)=><div key={i} style={{fontSize:13,color:'var(--ink-mid)',padding:'2px 0'}}>{t}</div>)}</div>}
    </div>
  );

  // ── PROTEIN ───────────────────────────────────────────────────────────────
  if(stage===STAGES.PROTEIN) return (
    <div>
      {backBtn(STAGES.SETUP)}
      <div className="ai-panel">
        {stepTitle(1,"What's your main ingredient?")}
        <div style={chipGrid}>{PROTEINS.map(p=><div key={p.value} style={chipStyle(selections.protein===p.value)} onClick={()=>sel("protein",p.value)}>{p.label}</div>)}</div>

  // ── COOKER ────────────────────────────────────────────────────────────────
  if(stage===STAGES.COOKER) return (
    <div>
      {backBtn(STAGES.PROTEIN)}
      <div className="ai-panel">
        {stepTitle(2,"How are you cooking it?")}
        <div style={chipGrid}>{COOKERS.map(c=><div key={c.value} style={chipStyle(selections.cooker===c.value)} onClick={()=>{sel("cooker",c.value);sel("flavor",[]);}}>{c.label}</div>)}</div>
        <button className="btn btn-primary" disabled={!selections.cooker} onClick={()=>setStage(STAGES.FLAVOR)}>Next →</button>

  // ── FLAVOR ────────────────────────────────────────────────────────────────

      <div className="ai-panel">

        <div style={chipGrid}>{getFlavors().map(f=><div key={f.value} style={chipStyle(selections.flavor.includes(f.value))} onClick={()=>toggleFlavor(f.value)}>{f.label}{selections.flavor.includes(f.value)&&<span style={{marginLeft:'auto',fontSize:11}}>✓</span>}</div>)}</div>

      {backBtn(STAGES.FLAVOR)}
      <div className="ai-panel">
        {stepTitle(4,"What's the occasion?")}
        <div style={chipGrid}>{OCCASIONS.map(o=><div key={o.value} style={chipStyle(selections.occasion===o.value)} onClick={()=>sel("occasion",o.value)}>{o.label}</div>)}</div>
        <button className="btn btn-primary" disabled={!selections.occasion} onClick={()=>setStage(STAGES.DETAILS)}>Next →</button>
      </div>
    </div>
