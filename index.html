  // ── DETAILS ───────────────────────────────────────────────────────────────
  if(stage===STAGES.DETAILS) return (
    <div>
      {backBtn(STAGES.OCCASION)}
      <div className="ai-panel">
        {stepTitle(5,"Any final details?")}
        <div className="form-group">
          <label className="form-label">Servings</label>
          <select className="form-input" style={{width:'auto'}} value={selections.servings} onChange={e=>sel("servings",e.target.value)}>
            {["1","2","4","6","8","10","12"].map(n=><option key={n} value={n}>{n} people</option>)}
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Extra notes (optional)</label>

        </div>
        <button className="btn btn-primary" onClick={()=>{setIdeaBatch(1);setIdeas([]);setIdeasPasteText("");setStage(STAGES.IDEAS);}}>Get Recipe Ideas →</button>
      </div>
    </div>

  // ── IDEAS ─────────────────────────────────────────────────────────────────
  if(stage===STAGES.IDEAS) return (
    <div>
      {backBtn(STAGES.DETAILS)}

      <div className="ai-panel" style={{marginBottom:16}}>
        <div style={{fontFamily:"'Special Elite',monospace",fontSize:12,textTransform:'uppercase',letterSpacing:2,color:'var(--saffron)',marginBottom:10}}>
          Your Request{ideaBatch>1?` — Batch ${ideaBatch}`:""}
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:16}}>
          {[selections.protein,COOKERS.find(c=>c.value===selections.cooker)?.label,...selections.flavor.map(f=>f.split(",")[0]),OCCASIONS.find(o=>o.value===selections.occasion)?.label,"👤 "+selections.servings].filter(Boolean).map((x,i)=>(
            <span key={i} style={{background:'var(--parchment-dark)',padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:600}}>{x}</span>
          ))}
        </div>

        {/* Step 1 */}
        <div style={{background:'var(--parchment-dark)',borderRadius:6,padding:16,marginBottom:12}}>

  );

  return null;
}


// ── Stashcook parser ───────────────────────────────────────────────────────
function parseStashcook(text) {
  try {
    const lines = text.split("\n").map(l=>l.trim()); let i=0;
    // Title
    while(i<lines.length && !lines[i]) i++;
    const title = lines[i++]; if(!title) return null;

    // Skip blank lines after title
    while(i<lines.length && !lines[i]) i++;

    // Extract Website URL if present
    let sourceUrl = "";
    if(i<lines.length && lines[i].match(/^Website:/i)) {
      const m = lines[i].match(/https?:\/\/\S+/);
      if(m) sourceUrl = m[0];
      i++;
    }

    // Skip blank lines before metadata
    while(i<lines.length && !lines[i]) i++;

    // Parse Time/Servings metadata
    let cookTime=0, servings=4;
    while(i<lines.length && lines[i]) {
      const l = lines[i];
      const t = l.match(/Time:\s*(\d+)/i); if(t) { cookTime=parseInt(t[1]); i++; continue; }
      const s = l.match(/Servings?:\s*(\d+)/i); if(s) { servings=parseInt(s[1]); i++; continue; }
      break;
    }

    // Skip blank lines before ingredients
    while(i<lines.length && !lines[i]) i++;

    // Read ingredients: stop at blank line, footer, or numbered step
    const ingredients=[];
    while(i<lines.length) {
      const l=lines[i];
      if(!l) { i++; break; }
      if(l.match(/^Shared/i)) break;
      if(l.match(/^\d+\.\s+[A-Z]/)) break;
      ingredients.push(l);
      i++;
    }

    // Skip blank lines before steps
    while(i<lines.length && !lines[i]) i++;

    // Read numbered steps
    const steps=[]; let cur="";
    while(i<lines.length) {
      const l=lines[i];
      if(l.match(/^Shared via/i)||l.match(/^Stash\./i)||l.match(/^https?:\/\//i)){i++;continue;}
      const n=l.match(/^(\d+)\.\s+(.*)/);
      if(n){ if(cur) steps.push(cur.trim()); cur=n[2]; }
      else if(l && cur) cur+=" "+l;
      else if(!l && cur){ steps.push(cur.trim()); cur=""; }
      i++;
    }
    if(cur.trim()) steps.push(cur.trim());

    if(!title || !ingredients.length || !steps.length) return null;
    return normalizeRecipe({
      id:uid(), title, cuisine:"", categories:[], servings, prepTime:0, cookTime,
      description:"", tags:[], diets:[], calories:null, protein:null, carbs:null,
      fat:null, fiber:null, photo:null, photos:[],
      ingredients, steps, source: sourceUrl,
    });
  } catch { return null; }
}



// ── Recipe URL fetcher ─────────────────────────────────────────────────────
async function fetchRecipeFromUrl(url) {
  const proxies = [
    u => "https://corsproxy.io/?" + encodeURIComponent(u),
    u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  ];
  let html = null;
  for (const makeProxy of proxies) {
    try {
      const res = await fetch(makeProxy(url), { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) {
        const data = await res.json();
        html = data.contents || data.body || null;
      } else {
        html = await res.text();
      }
      if (html && html.length > 500) break;
    } catch(e) { continue; }
  }
  if (!html) throw new Error("Could not fetch that page");

  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");

  // Extract og:image for photo
  const ogImage = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
                || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
  const imageUrl = ogImage ? ogImage[1] : null;

  // Try JSON-LD schema
  const scripts = Array.from(doc.querySelectorAll('script[type="application/ld+json"]'));
  for (const script of scripts) {
    try {
      const json = JSON.parse(script.textContent);
      const items = Array.isArray(json) ? json : (json["@graph"] ? json["@graph"] : [json]);
      for (const item of items) {
        const type = item["@type"];
        if (type === "Recipe" || (Array.isArray(type) && type.includes("Recipe"))) {
          return parseUrlRecipeSchema(item, url, imageUrl);
        }
      }
    } catch(e) {}
  }

  // Try microdata
  const schemaEl = doc.querySelector('[itemtype*="schema.org/Recipe"]');
  if (schemaEl) return parseUrlMicrodata(schemaEl, url, imageUrl);

  throw new Error("no_schema");
}

function parseUrlRecipeSchema(schema, sourceUrl, imageUrl) {
  function getText(val) {
    if (!val) return "";
    if (typeof val === "string") return val.replace(/<[^>]+>/g,"").trim();
    if (Array.isArray(val)) return getText(val[0]);
    if (typeof val === "object") return getText(val.text || val.name || val["@value"] || "");
    return String(val);
  }
  function getList(val) {
    if (!val) return [];
    return (Array.isArray(val) ? val : [val]).map(getText).filter(Boolean);
  }
  function parseDuration(iso) {
    if (!iso) return 0;
    const m = String(iso).match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
    if (!m) return parseInt(iso) || 0;
    return (parseInt(m[1]||0)*60) + parseInt(m[2]||0);
  }
  function extractNum(s) { return s ? parseInt(String(s).replace(/[^0-9]/g,""))||null : null; }
  const n = schema.nutrition || {};
  // Get image from schema or og:image
  const schemaImg = schema.image ? (Array.isArray(schema.image) ? schema.image[0] : schema.image) : null;
  const imgUrl = (typeof schemaImg === "object" ? schemaImg.url : schemaImg) || imageUrl || null;
  return normalizeRecipe({
    id: uid(), photo: null, photos: [], diets: [], categories: [],
    _imageUrl: imgUrl,
    title: getText(schema.name) || "Imported Recipe",
    description: getText(schema.description),
    cuisine: getText(schema.recipeCuisine),
    tags: getList(schema.keywords).join(",").split(",").map(s=>s.trim()).filter(Boolean).slice(0,8),
    servings: parseInt(getText(schema.recipeYield)) || 4,
    prepTime: parseDuration(schema.prepTime),
    cookTime: parseDuration(schema.cookTime),
    ingredients: getList(schema.recipeIngredient),
    steps: getList(schema.recipeInstructions),
    source: sourceUrl,
    calories: extractNum(n.calories), protein: extractNum(n.proteinContent),
    carbs: extractNum(n.carbohydrateContent), fat: extractNum(n.fatContent),
    fiber: extractNum(n.fiberContent), sugar: extractNum(n.sugarContent), sodium: extractNum(n.sodiumContent),
  });
}

function parseUrlMicrodata(el, sourceUrl, imageUrl) {
  function prop(name) {
    return Array.from(el.querySelectorAll('[itemprop="' + name + '"]'))
      .map(e => (e.getAttribute("content") || e.textContent).trim()).filter(Boolean);
  }
  return normalizeRecipe({
    id: uid(), photo: null, photos: [], diets: [], categories: [], tags: [],
    _imageUrl: imageUrl,
    title: prop("name")[0] || "Imported Recipe",
    description: prop("description")[0] || "",
    cuisine: prop("recipeCuisine")[0] || "",
    servings: parseInt(prop("recipeYield")[0]) || 4,
    prepTime: 0, cookTime: 0,
    ingredients: prop("recipeIngredient"),
    steps: prop("recipeInstructions"),
    source: sourceUrl,
  });
}

async function fetchAndAttachPhoto(recipe) {
  if (!recipe._imageUrl) return recipe;
  // Try multiple proxy + method combinations
  const imageUrl = recipe._imageUrl;
  const proxies = [
    u => "https://corsproxy.io/?" + encodeURIComponent(u),
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://images.weserv.nl/?url=" + encodeURIComponent(u.replace(/^https?:\/\//,"")),
  ];
  for (const makeProxy of proxies) {
    try {
      const proxiedUrl = makeProxy(imageUrl);
      const res = await fetch(proxiedUrl, { signal: AbortSignal.timeout(10000) });
      if (!res.ok) continue;
      const blob = await res.blob();
      if (!blob.type.startsWith("image/") && !blob.type.includes("octet")) continue;
      const file = new File([blob], "photo.jpg", { type: blob.type.startsWith("image/") ? blob.type : "image/jpeg" });
      const compressed = await compressImage(file);
      if (compressed) {
        const { _imageUrl, ...rest } = recipe;
        return { ...rest, photo: compressed, photos: [compressed] };
      }
    } catch(e) { continue; }
  }
  // All proxies failed — return recipe without photo but keep _imageUrl so edit form can show Fetch button
  return recipe;
}


// ── Import Tab ─────────────────────────────────────────────────────────────
function ImportTab({onImport}) {
  const [mode,setMode] = useState("stashcook");
  const [pasteText,setPasteText] = useState("");
  const [urlInput,setUrlInput] = useState("");
  const [loading,setLoading] = useState(false);
  const [result,setResult] = useState(null);
  const [error,setError] = useState("");
  const [imported,setImported] = useState([]);
  async function handleStashcookParse() {
    setError(""); setResult(null);
    const r = parseStashcook(pasteText);
    if (!r) { setError("Couldn't parse. Make sure it's a full Stashcook share."); return; }
    // If the recipe has a source URL, auto-fetch the photo from that page
    if (r.source) {
      setLoading(true);
      try {
        const proxied = "https://corsproxy.io/?" + encodeURIComponent(r.source);
        const res = await fetch(proxied, { signal: AbortSignal.timeout(8000) });
        const html = await res.text();
        const m = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
                || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
        if (m) {
          const withPhoto = await fetchAndAttachPhoto({ ...r, _imageUrl: m[1] });
          setResult(withPhoto);
        } else {
          setResult(r);
        }
      } catch {
        setResult(r); // still save without photo if fetch fails
      }
      setLoading(false);
    } else {
      setResult(r);
    }
  }
  async function handleUrlImport(url) {
    setError(""); setResult(null); setLoading(true);
    try {
      let recipe = await fetchRecipeFromUrl(url);
      // Try to fetch the recipe photo automatically
      if (recipe._imageUrl) {
        setError(""); // clear any error
        recipe = await fetchAndAttachPhoto(recipe);
      }
      setResult(recipe);
    } catch(e) {
      if (e.message === "no_schema") {
        setError("This page doesn't have structured recipe data. Try Paste Any Recipe instead.");
      } else {
        setError("Could not load that URL. Make sure it's a public recipe page and try again.");
      }
    }
    setLoading(false);
  }

  async function handleAIParse(inputText) {
    setError(""); setResult(null); setLoading(true);
    // Detect JSON and parse directly — no AI needed
    const trimmed = inputText.trim();
    if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
      try {
        const s = trimmed.indexOf("{"), e = trimmed.lastIndexOf("}");
        const parsed = JSON.parse(s !== -1 ? trimmed.slice(s, e+1) : trimmed);
        const norm = normalizeRecipe({...parsed, id:uid(), photo:null, photos:[]});
        if (!norm.title || norm.title === "Untitled") throw new Error("No title found");
        if (!norm.steps || !norm.steps.length) throw new Error("No steps found");
        setResult(norm);
        setLoading(false);
        return;
      } catch(jsonErr) {
        // fall through to AI
      }
    }
    try {
      const prompt = "Parse this recipe text into structured JSON. Return ONLY the JSON object.\n\nRequired fields: title, cuisine, servings (number), prepTime (number), cookTime (number), description, tags (array), diets (array), calories (number), protein (number), carbs (number), fat (number), fiber (number), ingredients (array of strings with amounts), steps (array of strings).\n\nRecipe text:\n" + inputText;
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})});
      const data = await res.json();
      const text = data.content?.map(b=>b.text||"").join("") || "";
      const clean = text.replace(/```json|```/g,"").trim();
      const start = clean.indexOf("{"), end2 = clean.lastIndexOf("}");
      const parsed = JSON.parse(clean.slice(start, end2+1));
      const norm = normalizeRecipe({...parsed, id:uid(), aiGenerated:true, photo:null, photos:[]});
      if(!norm.title||!norm.steps?.length) throw new Error();
      setResult(norm);
    } catch(e) { setError("Couldn't parse that text. Make sure it contains a full recipe."); }
    finally { setLoading(false); }
  }

  function saveResult() { if(!result) return; onImport(result); setImported(p=>[...p,result.title]); setResult(null); setPasteText(""); setUrlInput(""); }
  return (
    <div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,marginBottom:8}}>Import Recipes</div>
      <p className="text-muted" style={{marginBottom:24}}>Bring in recipes from Stashcook, a URL, or any copied text. Add photos after saving.</p>
      <div style={{display:'flex',gap:8,marginBottom:24,flexWrap:'wrap'}}>
        {[["stashcook","📲 Stashcook Share"],["url","🔗 From URL"],["text","📋 Paste Any Recipe"],["json","{ } Paste JSON"]].map(([id,label])=>(
          <button key={id} className={`btn ${mode===id?"btn-primary":"btn-outline"} btn-sm`} onClick={()=>{setMode(id);setResult(null);setError("");}}>{label}</button>
        ))}
      </div>
      <div className="ai-panel">
        {mode==="stashcook" && (<div><p style={{fontSize:14,marginBottom:12,lineHeight:1.6}}>In Stashcook: open recipe → <strong>Share</strong> → <strong>Share as text</strong>. Paste below.</p><textarea className="ai-input form-textarea" style={{width:'100%',minHeight:180,marginBottom:12,fontFamily:'monospace',fontSize:13}} placeholder="Classic Steakhouse Mustard Sauce..." value={pasteText} onChange={e=>{setPasteText(e.target.value);setError("");setResult(null);}} /><button className="btn btn-primary" onClick={handleStashcookParse} disabled={!pasteText.trim()||loading}>{loading?"Fetching photo…":"Parse & Import"}</button></div>)}
        {mode==="url" && (
          <div>
            <p style={{fontSize:14,marginBottom:12,lineHeight:1.6}}>
              Paste any recipe URL from sites like AllRecipes, Food Network, Serious Eats, NYT Cooking, Bon Appétit, and thousands more. Most major recipe sites work automatically.
            </p>
            <div className="ai-input-row" style={{marginBottom:8}}>
              <input className="ai-input" placeholder="https://www.allrecipes.com/recipe/..." value={urlInput} onChange={e=>{setUrlInput(e.target.value);setError("");setResult(null);}} />
              <button className="btn btn-primary" onClick={()=>handleUrlImport(urlInput)} disabled={!urlInput.trim()||loading}>{loading?"Fetching…":"Import"}</button>
            </div>
            <p className="text-muted">Paywalled sites (NYT Cooking, etc.) may not work. Try Paste Any Recipe as a fallback.</p>
          </div>
        )}
        {mode==="text" && (<div><p style={{fontSize:14,marginBottom:12,lineHeight:1.6}}>Paste any recipe — plain text, JSON from Claude, or any format. JSON is parsed instantly; other text is sent to AI.</p><textarea className="ai-input form-textarea" style={{width:'100%',minHeight:180,marginBottom:12,fontSize:13}} placeholder="Paste recipe in any format…" value={pasteText} onChange={e=>{setPasteText(e.target.value);setError("");setResult(null);}} /><button className="btn btn-primary" onClick={()=>handleAIParse(pasteText)} disabled={!pasteText.trim()||loading}>{loading?"Parsing…":pasteText.trim().startsWith("{")?"Parse & Preview":"Parse with AI"}</button></div>)}
        {mode==="json" && (
          <div>
            <p style={{fontSize:14,marginBottom:8,lineHeight:1.6}}>Paste raw JSON from Claude — any format works. No wizard needed.</p>
            <p style={{fontSize:12,color:"var(--ink-light)",marginBottom:12}}>In Claude ask: <em>"Give me a full recipe for X as a JSON object"</em> — copy the whole response and paste below.</p>
            <textarea
              className="ai-input form-textarea"
              style={{width:"100%",minHeight:200,marginBottom:12,fontSize:12,fontFamily:"monospace",display:"block"}}
              placeholder='{ "name": "Recipe Name", "ingredients": [...], "steps": [...] }'
              value={pasteText}
              onChange={e=>{setPasteText(e.target.value);setError("");setResult(null);}}
            />
            <button className="btn btn-primary" onClick={()=>handleAIParse(pasteText)} disabled={!pasteText.trim()||loading}>
              {loading?"Parsing…":"Parse & Preview"}
            </button>
          </div>
        )}
        {error && <div style={{marginTop:16,padding:'10px 14px',background:'#fde8e4',border:'1px solid var(--rust)',borderRadius:3,fontSize:13,color:'var(--rust)'}}>⚠️ {error}</div>}
        {result && (
          <div style={{marginTop:20,background:'var(--parchment-dark)',borderRadius:4,padding:20}}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,marginBottom:6}}>{result.title}</div>
            <div style={{fontSize:13,color:'var(--ink-light)',display:'flex',gap:16,flexWrap:'wrap',marginBottom:8}}>
              {result.cuisine&&<span>🌍 {result.cuisine}</span>}{(result.prepTime||result.cookTime)?<span>⏱ {(result.prepTime||0)+(result.cookTime||0)} min</span>:null}{result.servings&&<span>👤 {result.servings}</span>}{result.calories&&<span>🔥 {result.calories} cal</span>}
              <span>📝 {result.ingredients?.length} ingredients · {result.steps?.length} steps</span>
            </div>
            {(result.diets||[]).length>0 && <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>{result.diets.map(d=><span key={d} className="diet-badge">{d}</span>)}</div>}
            <div style={{display:'flex',gap:8}}><button className="btn btn-primary btn-sm" onClick={saveResult}>✓ Save to Library</button><button className="btn btn-ghost btn-sm" onClick={()=>setResult(null)}>Discard</button></div>
          </div>
        )}

}

// ── Sync / Share Modal ─────────────────────────────────────────────────────
function SyncModal({ data, onImport, onReplace, onClose }) {
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const [copied, setCopied] = useState(false);
  const fileInputRef = useRef(null);

  // Build export JSON (exclude photo data for a lean share, include for full backup)
  function buildExport(includePhotos) {
    const recipes = includePhotos ? data.recipes : data.recipes.map(r=>({...r, photo:null}));
    return JSON.stringify({ version: 1, exported: new Date().toISOString(), recipes }, null, 2);
  }

  function downloadFile(content, filename) {
    const blob = new Blob([content], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      // Fallback for Android
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }
  }

  function handleImportText(text, replace) {
    setImportStatus("");
    try {
      const parsed = JSON.parse(text.trim());
      const recipes = parsed.recipes || (Array.isArray(parsed) ? parsed : null);
      if (!recipes || !recipes.length) throw new Error("No recipes found");
      // Assign new IDs to avoid collisions
      const withNewIds = recipes.map(r => ({ ...r, id: r.id || uid() }));
      if (replace) {
        if (!window.confirm(`Replace ALL your recipes with ${withNewIds.length} imported recipe(s)? This cannot be undone.`)) return;
        onReplace(withNewIds);
      } else {
        onImport(withNewIds);
      }
      setImportStatus(`ok:${replace ? "Replaced" : "Merged"} ${withNewIds.length} recipe(s) successfully!`);
      setImportText("");
    } catch (e) {
      setImportStatus("err:Invalid JSON. Make sure you pasted the full export text.");
    }
  }

  function handleFileImport(e, replace) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => handleImportText(ev.target.result, replace);
    reader.readAsText(file);
    e.target.value = "";
  }

  const statusParts = importStatus.split(":");
  const statusType = statusParts[0];
  const statusMsg = statusParts.slice(1).join(":");

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sync-modal">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <div className="modal-title" style={{marginBottom:0}}>⇅ Share Recipes</div>
          <button className="btn-icon" style={{fontSize:22}} onClick={onClose}>✕</button>
        </div>

        {/* Export section */}
        <div className="sync-option">
          <div className="sync-option-title">📤 Export Your Recipes</div>
          <div className="sync-option-desc">
            Download or copy your recipe collection to share with your wife or keep as a backup.
            "Without photos" creates a much smaller file — good for texting or email.
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-primary btn-sm" onClick={()=>downloadFile(buildExport(false), `recipes-${new Date().toISOString().slice(0,10)}.json`)}>
              ⬇ Download (no photos)
            </button>
            <button className="btn btn-outline btn-sm" onClick={()=>downloadFile(buildExport(true), `recipes-full-${new Date().toISOString().slice(0,10)}.json`)}>
              ⬇ Download (with photos)
            </button>
            <button className="btn btn-ghost btn-sm" onClick={()=>copyToClipboard(buildExport(false))}>
              {copied ? "✓ Copied!" : "📋 Copy to clipboard"}
            </button>
          </div>
          <div style={{fontSize:12,color:'var(--ink-light)',marginTop:10}}>
            {data.recipes.length} recipe{data.recipes.length!==1?"s":""} in your library
          </div>
        </div>

        {/* Import section */}
        <div className="sync-option">
          <div className="sync-option-title">📥 Import Recipes</div>
          <div className="sync-option-desc">
            Paste JSON from someone else's export, or load a .json file. 
            <strong> Merge</strong> adds new recipes without touching yours.
            <strong> Replace</strong> overwrites everything.
          </div>

          {/* File import — label-wrapped for Android */}
          <div style={{marginBottom:12}}>
            <label style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',background:'var(--parchment-dark)',border:'1px solid var(--parchment-dark)',borderRadius:3,cursor:'pointer',fontSize:13,fontWeight:700}}>
              <input ref={fileInputRef} type="file" accept=".json,application/json" style={{width:'0.1px',height:'0.1px',opacity:0,position:'absolute',zIndex:-1}} onChange={e=>handleFileImport(e,false)} />
              📂 Load from file (merge)
            </label>
            <label style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',background:'var(--parchment-dark)',border:'1px solid var(--parchment-dark)',borderRadius:3,cursor:'pointer',fontSize:13,fontWeight:700,marginLeft:8}}>
              <input type="file" accept=".json,application/json" style={{width:'0.1px',height:'0.1px',opacity:0,position:'absolute',zIndex:-1}} onChange={e=>handleFileImport(e,true)} />
              📂 Load from file (replace)
            </label>
          </div>

          <textarea
            className="sync-textarea"
            placeholder='Or paste JSON here — e.g. {"version":1,"recipes":[...]}'
            value={importText}
            onChange={e=>{setImportText(e.target.value);setImportStatus("");}}
          />
          <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
            <button className="btn btn-primary btn-sm" onClick={()=>handleImportText(importText,false)} disabled={!importText.trim()}>Merge</button>
            <button className="btn btn-danger btn-sm" onClick={()=>handleImportText(importText,true)} disabled={!importText.trim()}>Replace All</button>
          </div>
          {importStatus && <div className={`sync-status ${statusType}`}>{statusMsg}</div>}
        </div>

        <div style={{fontSize:12,color:'var(--ink-light)',marginTop:4,lineHeight:1.6}}>
          💡 Tip: To sync with your wife, one of you exports and the other imports using Merge. 
          Do this whenever you add new recipes to keep both libraries in sync.
        </div>
      </div>
    </div>
  );
}

const PANTRY_KEY = "recipebook_pantry_v1";
const PANTRY_CATS = ["Proteins","Produce","Dairy","Grains & Pasta","Canned & Jarred","Spices & Herbs","Sauces & Condiments","Baking","Drinks","Snacks","Other"];
const STATUS_COLORS = { have:"#5a7a4a", low:"#d4891a", out:"#b84a2e" };
const STATUS_LABELS = { have:"Have it", low:"Running low", out:"Out / Need" };

function loadPantry() {
  try { const r=localStorage.getItem(PANTRY_KEY); if(r) return JSON.parse(r); } catch {}
  return [];
}
function savePantry(items) {
  try { localStorage.setItem(PANTRY_KEY, JSON.stringify(items)); } catch {}
}
function pantryUid() { return "p"+Math.random().toString(36).slice(2,9); }

// ── Pantry size/count helpers ───────────────────────────────────────────
// Items are stored with separate `size` (e.g. "12 oz", "3 lb") and `count`
// (e.g. "2", "4") fields rather than one combined quantity string, so the
// pantry shows precise amounts ("3 lb" vs a vague "1x").

function pantryDisplayAmount(item) {
  const size = (item.size||"").trim();
  const count = (item.count||"").trim();
  if (size && count) return `${count} × ${size}`;
  if (size) return size;
  if (count) return `${count}`;
  // fall back to legacy combined quantity field if size/count were never set
  return (item.quantity||"").trim();
}

// Best-effort one-time split of an old free-text quantity string into
// {count, size}. Used only when migrating items that predate the split.
function splitLegacyQuantity(qty) {
  if (!qty) return { count:"", size:"" };
  const str = qty.trim();
  // "COUNTx SIZE" or "COUNT x SIZE" (new prompt format)
  let m = str.match(/^(\d+)\s*x\s*(.+)$/i);
  if (m) return { count: m[1], size: m[2].trim() };
  // "COUNT boxes/jars/bottles/cans/bags ..." -> treat the unit word as size, number as count
  m = str.match(/^(\d+)\s+(.+)$/);
  if (m) return { count: m[1], size: m[2].trim() };
  // no leading number found — put it all in size, leave count blank
  return { count:"", size: str };
}

// ── Pantry photo-import auto-merge ──────────────────────────────────────
// Categories where quantity is fungible/continuous (spices, liquids, sauces)
// get their sizes summed into one running total. Categories where each
// package is a discrete unit worth tracking separately (proteins, boxed
// goods, cans) get the count bumped instead, keeping size info readable.
const PANTRY_ADDITIVE_CATS = ["Spices & Herbs", "Sauces & Condiments", "Drinks", "Baking"];

function isAdditiveCategory(category) {
  return PANTRY_ADDITIVE_CATS.includes(category);
}

// Loose match: same normalized name, ignoring case/whitespace/punctuation.
// Intentionally strict (not fuzzy substring) so "Chicken Breast" doesn't
// silently merge into "Chicken Broth" -- merging is irreversible enough
// that a false match is worse than missing one and adding a new row.
function findExistingPantryMatch(items, name, category) {
  const norm = s => (s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g," ").trim();
  const target = norm(name);
  if (!target) return null;
  return items.find(i => norm(i.name) === target && (i.category||"Other") === (category||"Other")) || null;
}

// Parses a leading number + unit from a size string, e.g. "12 oz" -> {num:12, unit:"oz"}.
// Returns null if it doesn't look like a clean numeric size.
function parseSizeNumber(size) {
  const m = (size||"").trim().match(/^([\d.]+)\s*([a-zA-Z]*)$/);
  if (!m) return null;
  const num = parseFloat(m[1]);
  if (isNaN(num)) return null;
  return { num, unit: (m[2]||"").trim().toLowerCase() };
}

// Merges a newly-scanned item into an existing pantry item per the rules above.
// Returns the updated existing item (does not mutate input).
function mergePantryItem(existing, scanned) {
  const updated = { ...existing };
  const newCount = parseInt(scanned.count||"1", 10) || 1;
  if (isAdditiveCategory(existing.category)) {
    // Try to sum sizes if both are clean same-unit numbers (e.g. "3.5 oz" + "2 oz").
    const a = parseSizeNumber(existing.size);
    const b = parseSizeNumber(scanned.size);
    if (a && b && a.unit === b.unit) {
      updated.size = `${(a.num + b.num * newCount).toString().replace(/\.0+$/,"")} ${a.unit}`.trim();
      updated.count = "1";
    } else if (!existing.size && scanned.size) {
      updated.size = scanned.size;
    }
    // if units don't match or can't parse, leave size as-is rather than guessing
  } else {
    // Discrete categories: bump count, keep a readable size breakdown if sizes differ.
    const existingCount = parseInt(existing.count||"1", 10) || 1;
    const totalCount = existingCount + newCount;
    if (!existing.size || existing.size === scanned.size) {
      updated.count = String(totalCount);
      updated.size = scanned.size || existing.size;
    } else {
      // sizes differ -- keep a breakdown rather than collapsing into a wrong total
      const prevSizes = existing._sizeBreakdown || [{ count: existingCount, size: existing.size }];
      updated._sizeBreakdown = [...prevSizes, { count: newCount, size: scanned.size }];
      updated.count = String(totalCount);
      updated.size = updated._sizeBreakdown.map(b=>`${b.count}x ${b.size}`).join(", ");
    }
  }
  // bumping toward "have" since new stock just arrived
  updated.status = "have";
  return updated;
}

// ── Auto-deduct review queue ────────────────────────────────────────────
// Scans calendar entries dated today or earlier against recipe ingredients,
// fuzzy-matching against pantry items flagged for auto-deduct (autoDeduct:true,
// never Spices & Herbs). Matches are queued for manual review, never changed
// automatically.

function loadPantryReview() {
  try { const r=localStorage.getItem(PANTRY_REVIEW_KEY); if(r) return JSON.parse(r); } catch {}
  return [];
}
function savePantryReview(list) {

}
function loadReviewSeenKeys() {
  try { const r=localStorage.getItem(PANTRY_REVIEW_SEEN_KEY); if(r) return JSON.parse(r); } catch {}
  return [];
}
function saveReviewSeenKeys(keys) {
  try { localStorage.setItem(PANTRY_REVIEW_SEEN_KEY, JSON.stringify(keys)); } catch {}
}

function normalizeWords(str) {
  return (str||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2);
}

// Standard edit-distance calculation (insert/delete/substitute), used to
// tolerate typos like "paty" vs "patty" or simple plural mismatches like
// "patty" vs "patties" without requiring exact spelling.
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j=0; j<=n; j++) dp[0][j] = j;
  for (let i=1; i<=m; i++) {
    for (let j=1; j<=n; j++) {
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Strips common plural endings so "patties" and "patty" (or "boxes" and
// "box") compare as the same root word before typo-tolerance kicks in.
function simpleStem(w) {
  if (w.endsWith("ies") && w.length > 5) return w.slice(0,-3) + "y";
  if (w.endsWith("es") && w.length > 4) return w.slice(0,-2);
  if (w.endsWith("s") && w.length > 3) return w.slice(0,-1);
  return w;
}

// Two words "match" if identical, or close enough by edit distance (after
// stemming plurals) that a typo or simple plural/singular difference is the
// most likely explanation. Tolerance scales with word length so short words
// still need to be exact (e.g. "cup" should never fuzzy-match "cap") while
// longer words allow a couple of character slips.
function wordsAreCloseEnough(a, b) {
  a = simpleStem(a); b = simpleStem(b);
  if (a === b) return true;
  const maxLen = Math.max(a.length, b.length);
  if (maxLen <= 4) return false; // too short to safely fuzz
  const tolerance = maxLen <= 6 ? 1 : 2;
  return levenshtein(a, b) <= tolerance;
}

function wordSetHasClose(wordSet, word) {
  for (const w of wordSet) {
    if (wordsAreCloseEnough(w, word)) return true;
  }
  return false;
}

// Returns true if a pantry item name plausibly appears in an ingredient string.
// Checks overlap in both directions and takes whichever ratio is more
// favorable, since pantry names often carry extra descriptive words
// ("Steak Cut French Fries") that a short recipe ingredient line
// ("French Fries") or quick-add entry won't repeat back verbatim. Word
// comparison itself is typo-tolerant so minor misspellings or singular vs.
// plural forms ("paty" vs "Patties") don't silently fail to match.
function fuzzyIngredientMatch(ingredientStr, pantryName) {
  const ingWords = normalizeWords(ingredientStr);
  const nameWords = normalizeWords(pantryName);
  if (nameWords.length === 0 || ingWords.length === 0) return false;
  const ingSet = new Set(ingWords);
  const nameSet = new Set(nameWords);
  const hitsInName = nameWords.filter(w=>wordSetHasClose(ingSet,w)).length;
  const hitsInIng = ingWords.filter(w=>wordSetHasClose(nameSet,w)).length;
  const ratioA = hitsInName / nameWords.length; // how much of the pantry name shows up in the ingredient
  const ratioB = hitsInIng / ingWords.length;   // how much of the ingredient shows up in the pantry name
  return Math.max(ratioA, ratioB) >= 0.6;
}

// Scans calendar for date<=today, matches recipe ingredients against
// auto-deduct-eligible pantry items, returns array of review entries.
// Each review entry: { key, date, slot, recipeId, recipeName, matches:[{pantryId,pantryName,ingredient}] }
function scanForAutoDeductMatches(calendar, recipes, pantryItems) {
  const today = todayKey();
  const eligible = pantryItems.filter(p => p.autoDeduct && p.category !== "Spices & Herbs");
  if (eligible.length === 0) return [];
  const results = [];
  for (const [date, slots] of Object.entries(calendar||{})) {
    if (date > today) continue; // only today or past
    for (const [slot, entries] of Object.entries(slots||{})) {
      const arr = Array.isArray(entries) ? entries : (entries && entries.id ? [entries] : []);
      for (const entry of arr) {
        if (!entry || !entry.id) continue;
        const recipe = recipes.find(r=>r.id===entry.id);
        if (!recipe || !recipe.ingredients) continue;
        const key = `${date}|${slot}|${entry.id}`;
        const matches = [];
        for (const ing of recipe.ingredients) {
          for (const p of eligible) {
            if (fuzzyIngredientMatch(ing, p.name)) {
              matches.push({ pantryId: p.id, pantryName: p.name, ingredient: ing });
            }
          }
        }
        if (matches.length > 0) {
          results.push({ key, date, slot, recipeId: entry.id, recipeName: recipe.title||recipe.name||"Recipe", matches });
        }
      }
    }
  }
  return results;
}

  function upsert(item) {

function PantryPhotoImport({ existingItems, onSave, onClose }) {
  const [phase, setPhase] = useState("pick"); // pick | scanning | review
  const [identified, setIdentified] = useState([]);
  const [error, setError] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const fileInputRef = useRef(null);

  async function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = () => rej(new Error("Read failed"));
      r.readAsDataURL(file);
    });
  }

  async function handleFiles(e) {
    const files = Array.from(e.target.files||[]);
    if (!files.length) return;
    setPhase("scanning");
    setError("");
    try {
      const imageContents = await Promise.all(files.map(async f => ({
        type: "image",
        source: { type: "base64", media_type: f.type||"image/jpeg", data: await fileToBase64(f) }
      })));
      const prompt = "You are a pantry inventory assistant. Look at these photos of pantry items. For every distinct product you can identify, return a JSON array (no markdown, no extra text) where each item has: name (short generic product name only, with brand names and store names stripped out -- for example 'Jewel Osco Pork Top Loin Chop' becomes 'Pork Top Loin Chop', 'Signature Select Breakfast Sausage Links' becomes 'Breakfast Sausage Links', 'Meijer 80% Lean Ground Beef' becomes '80% Lean Ground Beef'), category (one of: Proteins, Produce, Dairy, Grains & Pasta, Canned & Jarred, Spices & Herbs, Sauces & Condiments, Baking, Drinks, Snacks, Other), count (how many packages/units visible, as a plain number string like '1' or '2' -- always include this even if it is 1), size (the weight, volume, or size per package as a string, e.g. '12 oz', '1.89 lb', '16.9 fl oz', '1 jar' -- leave as empty string only if truly indeterminable), status (have), notes (empty string). Example: [{\"name\":\"Olive Oil\",\"category\":\"Sauces & Condiments\",\"count\":\"1\",\"size\":\"16.9 fl oz\",\"status\":\"have\",\"notes\":\"\"}]";
      const response = await fetch(`${SUPABASE_URL}/functions/v1/claude-sync`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "x-claude-secret": "henschel-claude-2026"
        },
        body: JSON.stringify({
          action: "ai",
          content: [...imageContents, { type: "text", text: prompt }],
          max_tokens: 4000
        })
      });
      const wrapper = await response.json();
      if (wrapper.error) throw new Error(wrapper.error);
      const data = wrapper.data;
      const text = (data.content||[]).map(b=>b.text||"").join("");
      const clean = text.replace(/```json|```/g,"").trim();
      let parsed;
      try {
        parsed = JSON.parse(clean);
      } catch(parseErr) {
        // Response may have been truncated mid-item. Salvage complete
        // {...} objects from the array rather than failing the whole scan.
        const matches = clean.match(/\{[^{}]*\}/g) || [];
        const salvaged = [];
        for (const m of matches) {
          try { salvaged.push(JSON.parse(m)); } catch {}
        }
        if (salvaged.length === 0) throw parseErr;
        parsed = salvaged;
      }
      setIdentified(parsed.map(item => ({ ...item, id: pantryUid() })));
      setPhase("review");
    } catch(err) {
      setError("Scan failed: " + err.message);
      setPhase("pick");
    }
  }

  function updateItem(idx, key, val) {
    setIdentified(prev => prev.map((item, i) => i===idx ? {...item, [key]: val} : item));
  }

  function removeItem(idx) {
    setIdentified(prev => prev.filter((_,i) => i!==idx));
  }

  function confirmSave() {
    const pantryNow = existingItems || [];
    identified.forEach(item => {
      const match = findExistingPantryMatch(pantryNow, item.name, item.category);
      if (match) {
        onSave(mergePantryItem(match, item));
      } else {
        onSave(item);
      }
    });
    onClose();
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"var(--cream)",borderRadius:"12px 12px 0 0",width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto",padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700}}>📷 Photo Import</div>
          <button className="btn-icon" onClick={onClose} style={{fontSize:20}}>✕</button>
        </div>

// ── Meal Calendar ─────────────────────────────────────────────────────────
const CAL_KEY = "recipebook_calendar_v1";
const CAL_PREFS_KEY = "recipebook_cal_prefs_v1";
const PANTRY_REVIEW_KEY = "recipebook_pantry_review_v1";
const PANTRY_REVIEW_SEEN_KEY = "recipebook_pantry_review_seen_v1";
const MEAL_SLOTS = ["breakfast","lunch","dinner","snack"];
const MEAL_LABELS = { breakfast:"🌅 Breakfast", lunch:"☀️ Lunch", dinner:"🌙 Dinner", snack:"🍎 Snack" };
const SLOT_COLORS = { breakfast:"#e8a020", lunch:"#5a9a3a", dinner:"#4a6aaa", snack:"#aa4a8a" };

function loadCalendar() {
  try { const r=localStorage.getItem(CAL_KEY); if(r) return JSON.parse(r); } catch {}
  return {};
}
function saveCalendar(data) { try { localStorage.setItem(CAL_KEY,JSON.stringify(data)); } catch {} }
function loadCalPrefs() {
  try { const r=localStorage.getItem(CAL_PREFS_KEY); if(r) return JSON.parse(r); } catch {}
  return { dailyGoal: 0, trackingEnabled: false };
}
function saveCalPrefs(p) { try { localStorage.setItem(CAL_PREFS_KEY,JSON.stringify(p)); } catch {} }

function dateKey(year,month,day) {
  return `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}
function todayKey() {
  const d=new Date(); return dateKey(d.getFullYear(),d.getMonth(),d.getDate());
}
function addDays(key,n) {
  const d=new Date(key+"T12:00:00"); d.setDate(d.getDate()+n);
  return dateKey(d.getFullYear(),d.getMonth(),d.getDate());
}
function getMealCals(entry, recipe) {
  if(!entry||!recipe||!recipe.calories) return null;
  const servings = entry.servings || 1;
  return Math.round(recipe.calories * servings);
}
function getDayTotalCals(dayData, recipes) {
  let total = 0; let hasAny = false;
  MEAL_SLOTS.forEach(slot=>{
    const entries=dayData[slot];
    if(!entries) return;
    const arr = Array.isArray(entries) ? entries : [entries];
    arr.forEach(entry=>{
      if(!entry) return;
      const recipe=recipes.find(r=>r.id===entry.id);
      const cals=getMealCals(entry,recipe);
      if(cals!=null){total+=cals;hasAny=true;}
    });
  });
  return hasAny ? total : null;
}

function CalorieBar({ consumed, goal }) {
  if(!goal || consumed === null) return null;
  const pct = Math.min(100, Math.round((consumed/goal)*100));
  const color = pct >= 100 ? "#b84a2e" : pct >= 85 ? "#d4891a" : "#5a7a4a";
  const remaining = goal - consumed;
  return (
    <div style={{marginTop:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
        <span style={{fontWeight:700,color}}>{consumed} cal eaten</span>
        <span style={{color:"var(--ink-light)"}}>{remaining>=0?`${remaining} remaining`:`${Math.abs(remaining)} over`} · goal {goal}</span>
      </div>
      <div style={{height:8,background:"var(--parchment-dark)",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:color,borderRadius:4,transition:"width 0.4s"}}/>
      </div>
    </div>
  );
}

function CalendarTab({ recipes, version, onQuickAddRecipe }) {
  const [calData, setCalData] = useState(()=>loadCalendar());
  useEffect(()=>{ if(version>0) setCalData(loadCalendar()); },[version]);
  const [prefs, setPrefs] = useState(()=>loadCalPrefs());
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [viewMode, setViewMode] = useState("month"); // "month" | "week"
  const [selectedDay, setSelectedDay] = useState(null);
  const [assignModal, setAssignModal] = useState(null);
  const [showGoalEdit, setShowGoalEdit] = useState(false);
  const [goalInput, setGoalInput] = useState(String(prefs.dailyGoal||""));

  useEffect(()=>{
    saveCalendar(calData);
  },[calData]);
  useEffect(()=>{ saveCalPrefs(prefs); },[prefs]);

  function getSlotArr(d,dk,slot) {
    const e=d[dk]?.[slot];
    if(!e) return [];
    return Array.isArray(e)?e:[e];
  }
  function addMeal(dk,slot,recipeId,servings=1,isLeftover=false) {
    setCalData(d=>{
      const arr=getSlotArr(d,dk,slot);
      if(arr.some(e=>e.id===recipeId)) return d; // already there
      return {...d,[dk]:{...(d[dk]||{}),[slot]:[...arr,{id:recipeId,servings,leftover:isLeftover}]}};
    });
  }
  function removeMeal(dk,slot,recipeId) {
    setCalData(d=>{
      const arr=getSlotArr(d,dk,slot).filter(e=>e.id!==recipeId);
      const day={...(d[dk]||{})};
      if(arr.length===0) delete day[slot]; else day[slot]=arr;
      const updated={...d,[dk]:day};
      if(Object.keys(day).length===0) delete updated[dk];
      return updated;
    });
  }
  function clearMeal(dk,slot) {
    setCalData(d=>{
      const day={...(d[dk]||{})}; delete day[slot];
      const updated={...d,[dk]:day};
      if(Object.keys(day).length===0) delete updated[dk];
      return updated;
    });
  }
  function assignWithLeftovers(dk,slot,recipeId,servings,leftoverSlot,leftoverDays) {
    setCalData(d=>{
      const arr=getSlotArr(d,dk,slot);
      let u={...d,[dk]:{...(d[dk]||{}),[slot]:arr.some(e=>e.id===recipeId)?arr:[...arr,{id:recipeId,servings,leftover:false}]}};
      for(let i=1;i<=leftoverDays;i++){
        const lk=addDays(dk,i);
        const larr=getSlotArr(u,lk,leftoverSlot);
        u={...u,[lk]:{...(u[lk]||{}),[leftoverSlot]:larr.some(e=>e.id===recipeId)?larr:[...larr,{id:recipeId,servings,leftover:true}]}};
      }
      return u;
    });
  }
  function updateServings(dk,slot,recipeId,servings) {
    setCalData(d=>{
      const arr=getSlotArr(d,dk,slot).map(e=>e.id===recipeId?{...e,servings}:e);
      return {...d,[dk]:{...(d[dk]||{}),[slot]:arr}};
    });
  }

  const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAY_NAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today_key=todayKey();
  const tonightDinnerArr=Array.isArray(calData[today_key]?.dinner)?calData[today_key].dinner:(calData[today_key]?.dinner?[calData[today_key].dinner]:[]);
  const tonightDinner=tonightDinnerArr[0]||null;
  const tonightRecipe=tonightDinner?recipes.find(r=>r.id===tonightDinner.id):null;

  // Get the week containing today or selected day
  function getWeekDays(anchorDate) {
    const d = new Date(anchorDate);
    const day = d.getDay();
    const days = [];
    for(let i=0;i<7;i++){
      const wd = new Date(d);
      wd.setDate(d.getDate() - day + i);
      days.push(dateKey(wd.getFullYear(), wd.getMonth(), wd.getDate()));
    }
    return days;
  }

  const [weekAnchor, setWeekAnchor] = useState(()=>{
    const d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  });
  const weekDays = getWeekDays(weekAnchor);

  function prevWeek() {
    const d = new Date(weekAnchor+"T12:00:00");
    d.setDate(d.getDate()-7);
    setWeekAnchor(dateKey(d.getFullYear(),d.getMonth(),d.getDate()));
  }
  function nextWeek() {
    const d = new Date(weekAnchor+"T12:00:00");
    d.setDate(d.getDate()+7);
    setWeekAnchor(dateKey(d.getFullYear(),d.getMonth(),d.getDate()));
  }

  // Day detail panel — shared between month and week views
  function DayPanel({dk}) {
    const dayData = calData[dk]||{};
    const dayTotalCals = prefs.trackingEnabled ? getDayTotalCals(dayData,recipes) : null;
    const isToday = dk===today_key;
    return (
      <div className="detail-panel" style={{padding:16,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700}}>
            {new Date(dk+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
            {isToday&&<span style={{marginLeft:8,fontSize:11,background:"var(--saffron)",color:"white",padding:"1px 7px",borderRadius:10,fontFamily:"'Lato',sans-serif",fontWeight:700}}>Today</span>}
          </div>
          {prefs.trackingEnabled&&dayTotalCals!=null&&(
            <div style={{fontFamily:"'Special Elite',monospace",fontSize:15,color:prefs.dailyGoal&&dayTotalCals>prefs.dailyGoal?"var(--rust)":"var(--sage)"}}>
              🔥 {dayTotalCals} cal
            </div>
          )}
        </div>
        {prefs.trackingEnabled&&<CalorieBar consumed={dayTotalCals||0} goal={prefs.dailyGoal}/>}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:12}}>
          {MEAL_SLOTS.map(slot=>{
            const slotEntries=dayData[slot]?(Array.isArray(dayData[slot])?dayData[slot]:[dayData[slot]]):[];
            return (
              <div key={slot} style={{borderRadius:6,background:"var(--parchment-dark)",border:`2px solid ${slotEntries.length>0?SLOT_COLORS[slot]:"transparent"}`,overflow:"hidden"}}>
                {/* Slot header */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderBottom:slotEntries.length>0?`1px solid ${SLOT_COLORS[slot]}22`:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:4,height:16,borderRadius:2,background:SLOT_COLORS[slot],flexShrink:0}}/>
                    <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:SLOT_COLORS[slot]}}>
                      {MEAL_LABELS[slot].split(" ")[1]}
                    </span>
                    {slotEntries.length===0&&<span style={{fontSize:12,color:"var(--ink-light)",fontStyle:"italic"}}>Nothing planned</span>}
                  </div>
                  <button className="btn btn-sm btn-outline" style={{fontSize:11}} onClick={()=>setAssignModal({dateKey:dk,slot})}>+ Add</button>
                </div>
                {/* Each recipe in slot */}
                {slotEntries.map((entry,ei)=>{
                  const recipe=entry?recipes.find(r=>r.id===entry.id):null;
                  const mealCals=getMealCals(entry,recipe);
                  return (
                    <div key={entry.id||ei} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderBottom:ei<slotEntries.length-1?`1px solid ${SLOT_COLORS[slot]}22`:"none"}}>
                      <div style={{flex:1,minWidth:0}}>
                        {!recipe?(
                          <div style={{fontSize:13,color:"var(--rust)",fontStyle:"italic"}}>⚠ Recipe not found</div>
                        ):(
                          <div>
                            <div style={{fontFamily:"'Playfair Display',serif",fontSize:14,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                              {entry.leftover&&<span style={{fontSize:10,background:SLOT_COLORS[slot]+"33",color:SLOT_COLORS[slot],padding:"1px 5px",borderRadius:10,marginRight:5,fontFamily:"'Lato',sans-serif",fontWeight:700}}>↩ LEFTOVER</span>}
                              {recipe.title}
                            </div>
                            {prefs.trackingEnabled&&(
                              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4,flexWrap:"wrap"}}>
                                {mealCals!=null&&<span style={{fontSize:12,fontWeight:700,color:"var(--saffron)"}}>🔥 {mealCals} cal</span>}
                                <div style={{display:"flex",alignItems:"center",gap:4}}>
                                  <span style={{fontSize:11,color:"var(--ink-light)"}}>Servings:</span>
                                  <button style={{width:20,height:20,borderRadius:"50%",border:"1px solid var(--saffron)",background:"none",color:"var(--saffron)",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}
                                    onClick={()=>updateServings(dk,slot,entry.id,Math.max(0.25,(entry.servings||1)-0.25))}>−</button>
                                  <span style={{fontSize:13,fontWeight:700,minWidth:24,textAlign:"center"}}>{entry.servings||1}</span>
                                  <button style={{width:20,height:20,borderRadius:"50%",border:"1px solid var(--saffron)",background:"none",color:"var(--saffron)",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}
                                    onClick={()=>updateServings(dk,slot,entry.id,(entry.servings||1)+0.25)}>+</button>
                                </div>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                      <button className="btn btn-sm btn-danger" style={{fontSize:11,padding:"6px 8px",flexShrink:0}} onClick={()=>removeMeal(dk,slot,entry.id)}>✕</button>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  const firstDay=new Date(viewYear,viewMonth,1).getDay();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();

  return (
    <div>
      {/* Tonight banner */}
      {tonightRecipe&&(
        <div style={{background:"var(--saffron)",color:"white",borderRadius:6,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:20}}>🌙</span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,opacity:0.85}}>Tonight's Dinner</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700}}>{tonightRecipe.title}{tonightDinner.leftover&&" ↩"}</div>
            {prefs.trackingEnabled&&tonightRecipe.calories&&<div style={{fontSize:12,opacity:0.9}}>🔥 {getMealCals(tonightDinner,tonightRecipe)} cal</div>}
          </div>
        </div>
      )}

      {/* Calorie goal */}
      {prefs.trackingEnabled&&(
        <div style={{background:"var(--cream)",border:"1px solid var(--parchment-dark)",borderRadius:6,padding:"12px 16px",marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontFamily:"'Special Elite',monospace",fontSize:12,textTransform:"uppercase",letterSpacing:1,color:"var(--ink-mid)"}}>Today's Calories</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setGoalInput(String(prefs.dailyGoal||""));setShowGoalEdit(v=>!v);}}>
              {prefs.dailyGoal?`Goal: ${prefs.dailyGoal}`:"Set goal"} ✏️
            </button>
          </div>
          {showGoalEdit&&(
            <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}>
              <input className="form-input" type="number" value={goalInput} onChange={e=>setGoalInput(e.target.value)} placeholder="e.g. 1800" style={{maxWidth:120}}/>
              <button className="btn btn-primary btn-sm" onClick={()=>{setPrefs(p=>({...p,dailyGoal:+goalInput||0}));setShowGoalEdit(false);}}>Save</button>
            </div>
          )}
          <CalorieBar consumed={getDayTotalCals(calData[today_key]||{},recipes)||0} goal={prefs.dailyGoal}/>
        </div>
      )}

      {/* View mode toggle + nav */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:6}}>
          <button className={`btn btn-sm ${viewMode==="month"?"btn-primary":"btn-outline"}`} onClick={()=>setViewMode("month")}>Month</button>
          <button className={`btn btn-sm ${viewMode==="week"?"btn-primary":"btn-outline"}`} onClick={()=>setViewMode("week")}>Week</button>
        </div>
        {viewMode==="month"?(
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>{if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1);}}>‹</button>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>{MONTH_NAMES[viewMonth]} {viewYear}</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1);}}>›</button>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={prevWeek}>‹</button>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700}}>
              {new Date(weekDays[0]+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})} –{" "}
              {new Date(weekDays[6]+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={nextWeek}>›</button>
          </div>
        )}
        {!prefs.trackingEnabled&&(
          <button className="btn btn-ghost btn-sm" onClick={()=>setPrefs(p=>({...p,trackingEnabled:true}))}>🔥 Calories</button>
        )}
        {prefs.trackingEnabled&&(
          <button className="btn btn-ghost btn-sm" onClick={()=>setPrefs(p=>({...p,trackingEnabled:false}))}>Hide cal</button>
        )}
      </div>

      {/* ── MONTH VIEW ── */}
      {viewMode==="month"&&(
        <>
          {selectedDay&&<div id='day-panel' style={{marginBottom:12}}><DayPanel dk={selectedDay}/></div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
            {DAY_NAMES.map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--ink-light)",padding:"4px 0",textTransform:"uppercase"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:16}}>
            {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
            {Array(daysInMonth).fill(null).map((_,i)=>{
              const day=i+1;
              const dk=dateKey(viewYear,viewMonth,day);
              const dayData=calData[dk]||{};
              const meals=MEAL_SLOTS.filter(s=>{const e=dayData[s];return Array.isArray(e)?e.length>0:!!e;});
              const isToday=dk===today_key;
              const isSelected=dk===selectedDay;
              const dayCals=prefs.trackingEnabled?getDayTotalCals(dayData,recipes):null;
              const overGoal=prefs.trackingEnabled&&prefs.dailyGoal&&dayCals>prefs.dailyGoal;
              return (
                <div key={day} onClick={()=>{
                    setSelectedDay(isSelected?null:dk);
                    if(!isSelected) setTimeout(()=>document.getElementById('day-panel')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
                  }}
                  style={{border:isSelected?"2px solid var(--saffron)":isToday?"2px solid var(--ink)":"1px solid var(--parchment-dark)",
                    borderRadius:6,padding:"6px 4px",minHeight:64,cursor:"pointer",
                    background:isSelected?"rgba(212,137,26,0.08)":isToday?"var(--parchment-dark)":"var(--cream)",
                    transition:"all 0.15s"}}>
                  <div style={{fontFamily:"'Special Elite',monospace",fontSize:13,fontWeight:isToday?700:400,textAlign:"center",
                    color:overGoal?"var(--rust)":isToday?"var(--ink)":"var(--ink-mid)",marginBottom:3}}>{day}</div>
                  {dayCals!=null&&<div style={{textAlign:"center",fontSize:9,fontWeight:700,color:overGoal?"var(--rust)":"var(--sage)",marginBottom:2}}>{dayCals}</div>}
                  <div style={{display:"flex",flexDirection:"column",gap:2}}>
                    {meals.map(slot=>{
                      const slotArr=Array.isArray(dayData[slot])?dayData[slot]:[dayData[slot]];
                      return slotArr.map((entry,ei)=>{
                        const recipe=recipes.find(r=>r.id===entry.id);
                        return (
                          <div key={slot+ei} style={{background:SLOT_COLORS[slot],borderRadius:3,padding:"1px 4px",
                            fontSize:9,color:"white",fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",
                            opacity:entry.leftover?0.65:1}}>
                            {entry.leftover?"↩ ":""}{recipe?recipe.title.slice(0,10)+(recipe.title.length>10?"…":""):"?"}
                          </div>
                        );
                      });
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          {!selectedDay&&<div style={{textAlign:"center",padding:"12px 0",color:"var(--ink-light)",fontSize:13}}>Tap a day to view or plan meals</div>}
        </>
      )}

      {/* ── WEEK VIEW ── */}
      {viewMode==="week"&&(
        <div>
          {/* Week header row */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:12}}>
            {weekDays.map(dk=>{
              const d=new Date(dk+"T12:00:00");
              const isToday=dk===today_key;
              const isSelected=dk===selectedDay;
              const hasMeals=MEAL_SLOTS.some(s=>{const e=calData[dk]?.[s];return Array.isArray(e)?e.length>0:!!e;});
              return (
                <div key={dk} onClick={()=>{
                    setSelectedDay(isSelected?null:dk);
                    if(!isSelected) setTimeout(()=>document.getElementById('day-panel')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
                  }}
                  style={{textAlign:"center",padding:"8px 4px",borderRadius:6,cursor:"pointer",
                    background:isSelected?"rgba(212,137,26,0.08)":isToday?"var(--parchment-dark)":"var(--cream)",
                    border:isSelected?"2px solid var(--saffron)":isToday?"2px solid var(--ink)":"1px solid var(--parchment-dark)",
                    transition:"all 0.15s"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"var(--ink-light)",textTransform:"uppercase"}}>{DAY_NAMES[d.getDay()]}</div>
                  <div style={{fontFamily:"'Special Elite',monospace",fontSize:16,fontWeight:isToday?700:400,color:isToday?"var(--ink)":"var(--ink-mid)"}}>{d.getDate()}</div>
                  {hasMeals&&<div style={{display:"flex",justifyContent:"center",gap:2,marginTop:3}}>
                    {MEAL_SLOTS.filter(s=>calData[dk]?.[s]).map(s=>(
                      <div key={s} style={{width:6,height:6,borderRadius:"50%",background:SLOT_COLORS[s]}}/>
                    ))}
                  </div>}
                </div>
              );
            })}
          </div>

          {/* Selected day detail OR full week meal grid */}
          {selectedDay&&weekDays.includes(selectedDay)?(
            <DayPanel dk={selectedDay}/>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {weekDays.map(dk=>{
                const d=new Date(dk+"T12:00:00");
                const isToday=dk===today_key;
                const meals=MEAL_SLOTS.filter(s=>{const e=calData[dk]?.[s];return Array.isArray(e)?e.length>0:!!e;});
                return (
                  <div key={dk} style={{background:"var(--cream)",border:`1px solid ${isToday?"var(--ink)":"var(--parchment-dark)"}`,borderRadius:6,overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:isToday?"var(--parchment-dark)":"transparent",cursor:"pointer"}}
                      onClick={()=>setSelectedDay(dk)}>
                      <div style={{fontFamily:"'Special Elite',monospace",fontSize:12,fontWeight:isToday?700:400}}>
                        {d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
                        {isToday&&<span style={{marginLeft:6,fontSize:10,background:"var(--saffron)",color:"white",padding:"1px 6px",borderRadius:10}}>Today</span>}
                      </div>
                      <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setSelectedDay(dk);}}>Plan +</button>
                    </div>
                    {meals.length>0?(
                      <div style={{padding:"6px 12px 10px",display:"flex",flexDirection:"column",gap:4}}>
                        {meals.map(slot=>{
                          const slotArr=Array.isArray(calData[dk][slot])?calData[dk][slot]:[calData[dk][slot]];
                          return slotArr.map((entry,ei)=>{
                            const recipe=recipes.find(r=>r.id===entry.id);
                            const cals=getMealCals(entry,recipe);
                            return (
                              <div key={slot+ei} style={{display:"flex",alignItems:"center",gap:8}}>
                                <div style={{width:3,height:16,borderRadius:2,background:SLOT_COLORS[slot],flexShrink:0}}/>
                                <div style={{fontSize:11,fontWeight:700,color:SLOT_COLORS[slot],width:50,textTransform:"uppercase"}}>{ei===0?slot:""}</div>
                                <div style={{flex:1,fontSize:13,fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                                  {entry.leftover&&"↩ "}{recipe?.title||"?"}
                                </div>
                                {prefs.trackingEnabled&&cals&&<div style={{fontSize:11,color:"var(--saffron)",fontWeight:700,flexShrink:0}}>{cals} cal</div>}
                              </div>
                            );
                          });
                        })}
                      </div>
                    ):(
                      <div style={{padding:"6px 12px 10px",fontSize:12,color:"var(--ink-light)",fontStyle:"italic"}}>Nothing planned — tap to add</div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {assignModal&&(
        <AssignMealModal
          dateKey={assignModal.dateKey} slot={assignModal.slot}
          recipes={recipes} currentIds={(()=>{const e=calData[assignModal.dateKey]?.[assignModal.slot];return Array.isArray(e)?e.map(x=>x.id):(e?[e.id]:[]);})()}
          trackingEnabled={prefs.trackingEnabled}
          onQuickAddRecipe={onQuickAddRecipe}
          onAssign={(recipeId,servings,leftoverSlot,leftoverDays)=>{
            if(leftoverSlot&&leftoverDays>0) assignWithLeftovers(assignModal.dateKey,assignModal.slot,recipeId,servings,leftoverSlot,leftoverDays);
            else addMeal(assignModal.dateKey,assignModal.slot,recipeId,servings);
            setAssignModal(null);
          }}
          onClose={()=>setAssignModal(null)}
        />
      )}
    </div>
  );
}


function AssignMealModal({ dateKey, slot, recipes, currentIds=[], trackingEnabled, onQuickAddRecipe, onAssign, onClose }) {
  const [search,setSearch]=useState("");
  const [chosen,setChosen]=useState(null);
  const [servings,setServings]=useState(1);
  const [hasLeftovers,setHasLeftovers]=useState(false);
  const [leftoverSlot,setLeftoverSlot]=useState("lunch");
  const [leftoverDays,setLeftoverDays]=useState(2);
  const [step,setStep]=useState("pick");
  const [quickAdding,setQuickAdding]=useState(false);

  const filtered=recipes.filter(r=>{
    const q=search.toLowerCase();
    return !q||r.title.toLowerCase().includes(q)||(r.cuisine||"").toLowerCase().includes(q)||(r.tags||[]).some(t=>t.includes(q));
  });
  const chosenRecipe=recipes.find(r=>r.id===chosen);
  const previewCals=chosenRecipe?.calories?Math.round(chosenRecipe.calories*servings):null;
  const dateLabel=new Date(dateKey+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  // Offer quick-add when the typed search doesn't exactly match an existing recipe title.
  const trimmedSearch = search.trim();
  const exactMatch = trimmedSearch && recipes.some(r=>r.title.toLowerCase()===trimmedSearch.toLowerCase());
  const showQuickAdd = trimmedSearch.length>0 && !exactMatch && onQuickAddRecipe;

  async function estimateNutrition(foodName) {
    try {
      const prompt = `Estimate typical nutrition for one serving of "${foodName}" as it would commonly be prepared at home. Return ONLY a JSON object, no markdown, no extra text, with these exact numeric fields (no units, just numbers, reasonable single-serving estimates): {"calories":0,"protein":0,"carbs":0,"fat":0}`;
      const response = await fetch(`${SUPABASE_URL}/functions/v1/claude-sync`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "x-claude-secret": "henschel-claude-2026"
        },
        body: JSON.stringify({ action: "ai", content: prompt, max_tokens: 200 })
      });
      const wrapper = await response.json();
      if (wrapper.error) throw new Error(wrapper.error);
      const text = (wrapper.data.content||[]).map(b=>b.text||"").join("");
      const clean = text.replace(/```json|```/g,"").trim();
      return JSON.parse(clean);
    } catch {
      return null; // estimate failed — fall back to letting the user type it in manually
    }
  }

  async function handleQuickAdd() {
    if (!trimmedSearch || quickAdding) return;
    setQuickAdding(true);
    const nutrition = await estimateNutrition(trimmedSearch);
    const quick = {
      id: uid(),
      title: trimmedSearch,
      description: "",
      cuisine: "American",
      categories: ["Other"],
      servings: 1,
      prepTime: 0,
      cookTime: 0,
      tags: ["quick-add"],
      diets: [],
      calories: nutrition?.calories ?? null,
      protein: nutrition?.protein ?? null,
      carbs: nutrition?.carbs ?? null,
      fat: nutrition?.fat ?? null,
      ingredients: [trimmedSearch],
      steps: [],
      notes: nutrition ? "" : "Calories not estimated — edit this recipe to add nutrition info manually.",
      isQuickAdd: true
    };
    await onQuickAddRecipe(quick);
    setChosen(quick.id);
    setQuickAdding(false);
  }

  if(step==="leftovers") return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="modal-title">Leftovers?</div>
        {trackingEnabled&&(
          <div style={{background:"var(--parchment-dark)",borderRadius:6,padding:"12px 16px",marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--ink-mid)",marginBottom:8}}>How many servings are you having?</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <button className="scaler-btn" onClick={()=>setServings(s=>Math.max(0.25,s-0.25))}>−</button>
              <span style={{fontFamily:"'Special Elite',monospace",fontSize:22,minWidth:36,textAlign:"center"}}>{servings}</span>
              <button className="scaler-btn" onClick={()=>setServings(s=>s+0.25)}>+</button>
              {previewCals!=null&&<span style={{fontSize:14,fontWeight:700,color:"var(--saffron)",marginLeft:8}}>🔥 {previewCals} cal</span>}
            </div>
          </div>
        )}
        <p style={{fontSize:14,color:"var(--ink-mid)",marginBottom:16,lineHeight:1.6}}>
          Making <strong>{chosenRecipe?.title}</strong> for {MEAL_LABELS[slot].split(" ")[1]} on {dateLabel}. Will you eat leftovers over the next few days?
        </p>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button className={`btn btn-sm ${hasLeftovers?"btn-primary":"btn-outline"}`} onClick={()=>setHasLeftovers(true)}>Yes, fill leftovers</button>
          <button className={`btn btn-sm ${!hasLeftovers?"btn-primary":"btn-outline"}`} onClick={()=>setHasLeftovers(false)}>No thanks</button>
        </div>
        {hasLeftovers&&(
          <div style={{background:"var(--parchment-dark)",borderRadius:6,padding:16,marginBottom:16}}>
            <div className="form-group">
              <label className="form-label">Which meal for leftovers?</label>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {MEAL_SLOTS.map(s=><button key={s} className={`btn btn-sm ${leftoverSlot===s?"btn-primary":"btn-outline"}`} onClick={()=>setLeftoverSlot(s)}>{MEAL_LABELS[s].split(" ")[1]}</button>)}
              </div>
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">How many days?</label>
              <div style={{display:"flex",gap:8}}>
                {[1,2,3,4,5].map(n=><button key={n} className={`btn btn-sm ${leftoverDays===n?"btn-primary":"btn-outline"}`} onClick={()=>setLeftoverDays(n)}>{n}</button>)}
              </div>
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" onClick={()=>onAssign(chosen,servings,hasLeftovers?leftoverSlot:null,hasLeftovers?leftoverDays:0)}>Save to Calendar</button>
          <button className="btn btn-ghost" onClick={()=>setStep("pick")}>← Back</button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:540}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div className="modal-title" style={{marginBottom:0}}>{MEAL_LABELS[slot]} · {dateLabel}</div>
          <button className="btn-icon" style={{fontSize:22}} onClick={onClose}>✕</button>
        </div>
        <input className="search-input" style={{width:"100%",marginBottom:12}} placeholder="Search recipes…" value={search} onChange={e=>setSearch(e.target.value)} />
        {showQuickAdd && (
          <div onClick={handleQuickAdd}
            style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:6,cursor:quickAdding?"default":"pointer",
              border:"2px dashed var(--saffron)",background:"rgba(212,137,26,0.06)",marginBottom:12,opacity:quickAdding?0.6:1}}>
            <span style={{fontSize:18}}>⚡</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14}}>{quickAdding?"Estimating nutrition…":`Quick add "${trimmedSearch}"`}</div>
              <div style={{fontSize:11,color:"var(--ink-light)"}}>No recipe needed — just plan it on the calendar</div>
            </div>
          </div>
        )}
        <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {filtered.map(r=>{
            const photos=r.photos&&r.photos.length>0?r.photos:(r.photo?[r.photo]:[]);
            return (
              <div key={r.id} onClick={()=>setChosen(r.id)}
                style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:6,cursor:"pointer",
                  border:`2px solid ${chosen===r.id?"var(--saffron)":currentIds.includes(r.id)?SLOT_COLORS[slot]||"var(--sage)":"var(--parchment-dark)"}`,
                  background:chosen===r.id?"rgba(212,137,26,0.08)":currentIds.includes(r.id)?"rgba(90,154,58,0.06)":"var(--cream)",transition:"all 0.15s"}}>
                {photos[0]
                  ? <img src={photos[0]} style={{width:44,height:44,borderRadius:6,objectFit:"cover",flexShrink:0}} alt=""/>
                  : <div style={{width:44,height:44,borderRadius:6,background:"var(--parchment-dark)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{recipeEmoji(r)}</div>
                }
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.title}</div>
                  <div style={{fontSize:12,color:"var(--ink-light)"}}>
                    {[r.cuisine,r.prepTime!=null&&((r.prepTime||0)+(r.cookTime||0))+"min",r.calories&&"🔥"+r.calories+"cal"].filter(Boolean).join(" · ")}
                  </div>
                </div>
                {chosen===r.id?<span style={{color:"var(--saffron)",fontSize:20,flexShrink:0}}>✓</span>:currentIds.includes(r.id)?<span style={{color:"var(--sage)",fontSize:14,flexShrink:0}}>✓ added</span>:null}
              </div>
            );
          })}
          {filtered.length===0&&<div style={{textAlign:"center",padding:30,color:"var(--ink-light)"}}>No recipes match</div>}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" disabled={!chosen} onClick={()=>setStep("leftovers")}>Next →</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RecipeBook />);
  </script>
</body>
</html>
